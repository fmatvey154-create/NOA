<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NOA</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  min-height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  overscroll-behavior: none;
}

button,
textarea,
input {
  font: inherit;
}

button {
  -webkit-appearance: none;
  appearance: none;
}

.app {
  position: relative;

  width: 100%;
  max-width: 900px;

  height: 100dvh;
  min-height: 0;

  margin: 0 auto;

  overflow: hidden;

  background: #000;
}

/* =========================================================
   ЛОГОТИП
========================================================= */

.logo-screen {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  /*
    ВАЖНО:
    Логотип должен находиться НАД чатом,
    но НЕ должен перекрывать меню и панели.
  */
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: center;

  /*
    Главное исправление:
    фон прозрачный, поэтому чат и поле ввода
    остаются видимыми.
  */
  background: transparent;

  /*
    Логотип не блокирует нажатия.
  */
  pointer-events: none;

  transition:
    transform .85s cubic-bezier(.22,.61,.36,1),
    opacity .65s ease;
}

.logo {
  margin: 0;
  padding: 0;

  font-size: clamp(114px, 30vw, 225px);
  font-weight: 800;
  letter-spacing: -.075em;
  line-height: 1;

  background: linear-gradient(
    180deg,
    #fff 0%,
    #dedede 35%,
    #898989 68%,
    #f4f4f4 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;

  animation: logoAppear 1s ease both;
}

@keyframes logoAppear {
  from {
    opacity: 0;
    transform: scale(.95);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

/*
  После первого сообщения
  большой логотип уезжает вверх.
*/

.app.started .logo-screen {
  transform: translateY(-100%);
  opacity: 0;
}

/* =========================================================
   ЧАТ
========================================================= */

.chat {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 15;

  display: flex;
  flex-direction: column;

  min-height: 0;

  background: #000;
}

/* =========================================================
   ВЕРХНЯЯ ПАНЕЛЬ
========================================================= */

.topbar {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: center;

  flex-shrink: 0;

  height: 62px;

  padding:
    env(safe-area-inset-top)
    14px
    0;

  box-sizing: content-box;

  background: rgba(0,0,0,.45);

  border-bottom: 1px solid rgba(255,255,255,.055);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.menu-button {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 44px;
  height: 44px;

  padding: 0;

  color: #eee;
  background: transparent;

  border: none;
  border-radius: 12px;

  font-size: 27px;

  cursor: pointer;
}

.menu-button:active {
  background: #191919;
  transform: scale(.94);
}

/*
  Маленький логотип сначала скрыт,
  чтобы не было двух NOA одновременно.
*/

.topbar-logo {
  position: absolute;

  left: 50%;

  transform: translateX(-50%);

  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.04em;

  opacity: 0;

  transition: opacity .35s ease;

  background: linear-gradient(
    180deg,
    #fff,
    #999
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.app.started .topbar-logo {
  opacity: 1;
}

/* =========================================================
   СООБЩЕНИЯ
========================================================= */

.messages {
  flex: 1;

  min-height: 0;

  overflow-x: hidden;
  overflow-y: auto;

  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;

  padding:
    22px
    15px
    20px;

  scrollbar-width: thin;
  scrollbar-color: #292929 transparent;
}

.message {
  width: fit-content;

  max-width: min(85%, 650px);

  margin: 0 0 14px;

  padding: 12px 15px;

  border-radius: 18px;

  font-size: 16px;
  line-height: 1.5;

  white-space: pre-wrap;
  overflow-wrap: anywhere;

  animation: messageIn .2s ease;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user {
  margin-left: auto;

  color: #fff;

  background: #191919;

  border: 1px solid rgba(255,255,255,.07);

  border-bottom-right-radius: 6px;
}

.message.noa {
  margin-right: auto;

  padding-left: 2px;

  color: #e8e8e8;

  background: transparent;
}

.message.error {
  color: #ff7777;
}

.message-image {
  display: block;

  width: auto;
  max-width: 260px;
  max-height: 340px;

  margin: 0;

  border-radius: 15px;

  object-fit: cover;
}

.message-image + .message-caption {
  margin-top: 8px;
}

/* =========================================================
   ПОЛЕ ВВОДА
========================================================= */

.input-area {
  position: relative;
  z-index: 2;

  flex-shrink: 0;

  padding:
    12px
    12px
    calc(12px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      to top,
      #000 70%,
      rgba(0,0,0,.88)
    );
}

/* =========================================================
   ПРЕВЬЮ ВЛОЖЕНИЯ
========================================================= */

.pending-attachment {
  display: none;

  width: 100%;

  padding:
    0
    8px
    8px;
}

.pending-attachment.open {
  display: block;
}

.pending-image-card {
  position: relative;

  display: inline-block;

  width: 76px;
  height: 76px;
}

.pending-image {
  display: block;

  width: 76px;
  height: 76px;

  object-fit: cover;

  border-radius: 15px;

  border:
    1px solid
    rgba(255,255,255,.12);

  background: #151515;
}

.remove-pending-image {
  position: absolute;

  top: -8px;
  right: -8px;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 25px;
  height: 25px;

  padding: 0;

  color: #fff;
  background: #292929;

  border:
    1px solid
    #444;

  border-radius: 50%;

  font-size: 17px;
  line-height: 1;

  cursor: pointer;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.5);
}

.remove-pending-image:active {
  transform: scale(.9);
}

/* =========================================================
   INPUT BOX
========================================================= */

.input-box {
  position: relative;

  display: flex;
  align-items: flex-end;

  gap: 8px;

  width: 100%;

  padding: 7px 8px;

  background: #111;

  border:
    1px solid
    #292929;

  border-radius: 25px;

  box-shadow:
    0 0 22px
    rgba(255,255,255,.025);
}

/* =========================================================
   ВЛОЖЕНИЯ
========================================================= */

.attachment-wrapper {
  position: relative;

  flex-shrink: 0;

  align-self: flex-end;
}

.attachment-button {
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 42px;
  height: 42px;

  padding: 0;

  color: #ddd;
  background: transparent;

  border: none;
  border-radius: 50%;

  overflow: hidden;

  cursor: pointer;
}

.attachment-button:active {
  background: #202020;
  transform: scale(.93);
}

.attachment-button:disabled {
  opacity: .4;
}

.attachment-icon {
  position: absolute;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 32px;
  height: 32px;

  font-size: 21px;
  line-height: 1;

  opacity: 0;

  pointer-events: none;
}

.attachment-icon.photo {
  animation:
    attachmentPhoto
    6.4s
    infinite;
}

.attachment-icon.file {
  animation:
    attachmentFile
    6.4s
    infinite;

  animation-delay: 3.2s;
}

@keyframes attachmentPhoto {
  0% {
    opacity: 0;
    transform:
      translateY(-13px)
      rotate(0);
  }

  9.375% {
    opacity: 1;
    transform:
      translateY(0)
      rotate(0);
  }

  40.625% {
    opacity: 1;
    transform:
      translateY(0)
      rotate(0);
  }

  50% {
    opacity: 0;
    transform:
      translateY(17px)
      rotate(-18deg);
  }

  100% {
    opacity: 0;
    transform:
      translateY(17px)
      rotate(-18deg);
  }
}

@keyframes attachmentFile {
  0% {
    opacity: 0;
    transform:
      translateY(-13px)
      rotate(0);
  }

  9.375% {
    opacity: 1;
    transform:
      translateY(0)
      rotate(0);
  }

  40.625% {
    opacity: 1;
    transform:
      translateY(0)
      rotate(0);
  }

  50% {
    opacity: 0;
    transform:
      translateY(17px)
      rotate(-18deg);
  }

  100% {
    opacity: 0;
    transform:
      translateY(17px)
      rotate(-18deg);
  }
}

/* =========================================================
   МЕНЮ ВЛОЖЕНИЙ
========================================================= */

.attachment-menu {
  position: absolute;

  left: 0;
  bottom: 52px;

  width: 185px;

  padding: 7px;

  background: rgba(22,22,22,.98);

  border:
    1px solid
    #303030;

  border-radius: 17px;

  box-shadow:
    0 14px 40px
    rgba(0,0,0,.55);

  opacity: 0;
  visibility: hidden;

  transform:
    translateY(8px)
    scale(.96);

  transform-origin: bottom left;

  transition:
    opacity .2s ease,
    transform .2s ease,
    visibility .2s ease;

  z-index: 50;
}

.attachment-menu.open {
  opacity: 1;

  visibility: visible;

  transform:
    translateY(0)
    scale(1);
}

.attachment-option {
  display: flex;
  align-items: center;

  gap: 12px;

  width: 100%;
  min-height: 46px;

  padding: 9px 11px;

  color: #eee;
  background: transparent;

  border: none;
  border-radius: 11px;

  text-align: left;

  font-size: 15px;

  cursor: pointer;
}

.attachment-option:active {
  background: #292929;
}

.attachment-option-icon {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 27px;
  height: 27px;

  font-size: 20px;
}

.hidden-file-input {
  display: none;
}

/* =========================================================
   TEXTAREA
========================================================= */

textarea {
  display: block;

  flex: 1;

  min-width: 0;

  min-height: 42px;
  max-height: 130px;

  padding: 11px 0;

  resize: none;

  overflow-y: auto;

  color: #fff;

  caret-color: #fff;

  background: transparent;

  border: none;

  outline: none;

  font-size: 16px;
  line-height: 20px;
}

textarea::placeholder {
  color: #858585;
}

/* =========================================================
   SEND
========================================================= */

.send {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 42px;
  height: 42px;

  flex-shrink: 0;

  color: #000;

  background: #f5f5f5;

  border: none;
  border-radius: 50%;

  font-size: 25px;
  line-height: 1;

  cursor: pointer;
}

.send:active {
  transform: scale(.93);
}

.send:disabled {
  opacity: .4;
}

/* =========================================================
   ПЕЧАТЬ NOA
========================================================= */

.typing {
  display: flex;
  align-items: center;

  gap: 5px;

  padding: 12px 4px;
}

.typing span {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #888;

  animation:
    pulse 1.1s
    infinite
    ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes pulse {
  0%,
  60%,
  100% {
    opacity: .35;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-4px);
  }
}

/* =========================================================
   БОКОВОЕ МЕНЮ
========================================================= */

.overlay {
  position: absolute;
  inset: 0;

  z-index: 25;

  background: rgba(0,0,0,.65);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity .25s,
    visibility .25s;
}

.overlay.open {
  opacity: 1;
  visibility: visible;
}

.side-menu {
  position: absolute;

  top: 0;
  bottom: 0;
  left: 0;

  z-index: 30;

  width: min(310px, 82vw);

  padding-top:
    env(safe-area-inset-top);

  background: #0a0a0a;

  border-right:
    1px solid
    #242424;

  transform:
    translateX(-101%);

  transition:
    transform .28s ease;

  overflow-y: auto;
}

.side-menu.open {
  transform:
    translateX(0);
}

.menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  height: 62px;

  padding: 0 18px;

  border-bottom:
    1px solid
    #222;
}

.menu-brand {
  font-size: 22px;
  font-weight: 800;

  letter-spacing: -.04em;

  background:
    linear-gradient(
      #fff,
      #999
    );

  -webkit-background-clip: text;
  background-clip: text;

  -webkit-text-fill-color: transparent;
}

.close-menu {
  width: 38px;
  height: 38px;

  color: #ddd;

  background: transparent;

  border: none;
  border-radius: 10px;

  font-size: 25px;

  cursor: pointer;
}

.close-menu:active {
  background: #191919;
}

.menu-item {
  display: flex;
  align-items: center;

  gap: 12px;

  width: 100%;

  min-height: 54px;

  padding: 15px 20px;

  color: #ccc;

  background: transparent;

  border: none;

  border-bottom:
    1px solid
    rgba(255,255,255,.045);

  text-align: left;

  font-size: 15px;

  cursor: pointer;
}

.menu-item:active {
  background: #181818;
}

.menu-item-icon {
  width: 24px;

  color: #aaa;

  text-align: center;

  font-size: 18px;
}

.menu-note {
  padding: 18px 20px;

  color: #555;

  font-size: 12px;
}

/* =========================================================
   ПАНЕЛИ
========================================================= */

.panel-overlay {
  position: absolute;
  inset: 0;

  z-index: 70;

  display: flex;
  align-items: flex-end;

  background: rgba(0,0,0,.7);

  opacity: 0;
  visibility: hidden;

  pointer-events: none;

  transition:
    opacity .25s ease,
    visibility .25s ease;
}

.panel-overlay.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.panel {
  position: relative;

  width: 100%;
  max-height: 82%;

  overflow-y: auto;

  padding:
    20px
    18px
    calc(
      20px +
      env(safe-area-inset-bottom)
    );

  background: #101010;

  border-top:
    1px solid
    rgba(255,255,255,.1);

  border-radius:
    24px
    24px
    0
    0;

  transform:
    translateY(100%);

  transition:
    transform .3s
    cubic-bezier(.22,.61,.36,1);
}

.panel-overlay.open .panel {
  transform:
    translateY(0);
}

.panel-title {
  margin: 0 45px 17px 0;

  color: #fff;

  font-size: 21px;

  font-weight: 700;
}

.panel-close {
  position: absolute;

  top: 12px;
  right: 14px;

  width: 38px;
  height: 38px;

  color: #ccc;

  background: #202020;

  border: none;

  border-radius: 50%;

  font-size: 22px;

  cursor: pointer;
}

.panel-card {
  margin-bottom: 10px;

  padding: 15px;

  background: #181818;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-radius: 16px;
}

.panel-card-title {
  margin-bottom: 5px;

  color: #fff;

  font-size: 16px;

  font-weight: 600;
}

.panel-card-text {
  color: #888;

  font-size: 13px;

  line-height: 1.45;
}

.panel-button {
  width: 100%;

  margin-top: 10px;

  padding: 13px;

  color: #fff;

  background: #242424;

  border:
    1px solid
    #333;

  border-radius: 13px;

  font-size: 14px;

  cursor: pointer;
}

.panel-button:active {
  transform: scale(.98);
}

/* =========================================================
   ИСТОРИЯ
========================================================= */

.history-list {
  display: flex;
  flex-direction: column;

  gap: 8px;
}

.history-item {
  width: 100%;

  padding: 13px;

  color: #ddd;

  background: #181818;

  border:
    1px solid
    #262626;

  border-radius: 13px;

  text-align: left;

  cursor: pointer;
}

.history-item:active {
  background: #242424;
}

.history-item-title {
  overflow: hidden;

  margin-bottom: 4px;

  color: #eee;

  white-space: nowrap;
  text-overflow: ellipsis;
}

.history-item-date {
  color: #666;

  font-size: 11px;
}

/* =========================================================
   ПРОЕКТЫ
========================================================= */

.project-card {
  padding: 16px;

  margin-bottom: 10px;

  background:
    linear-gradient(
      145deg,
      #181818,
      #101010
    );

  border:
    1px solid
    #292929;

  border-radius: 16px;
}

.project-name {
  color: #fff;

  font-size: 17px;

  font-weight: 700;
}

.project-description {
  margin-top: 6px;

  color: #888;

  font-size: 13px;

  line-height: 1.45;
}

/* =========================================================
   ТАРИФЫ
========================================================= */

.plan {
  position: relative;

  padding: 17px;

  margin-bottom: 10px;

  background: #181818;

  border:
    1px solid
    #292929;

  border-radius: 17px;
}

.plan-name {
  color: #fff;

  font-size: 18px;

  font-weight: 700;
}

.plan-price {
  margin-top: 5px;

  color: #aaa;

  font-size: 14px;
}

.plan-description {
  margin-top: 10px;

  color: #777;

  font-size: 13px;

  line-height: 1.5;
}

/* =========================================================
   УВЕДОМЛЕНИЯ
========================================================= */

.notification {
  padding: 14px;

  margin-bottom: 9px;

  background: #181818;

  border:
    1px solid
    #292929;

  border-radius: 15px;
}

.notification-title {
  color: #fff;

  font-weight: 600;
}

.notification-text {
  margin-top: 5px;

  color: #888;

  font-size: 13px;

  line-height: 1.45;
}

/* =========================================================
   НАСТРОЙКИ
========================================================= */

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;

  padding: 14px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);
}

.setting-row:last-child {
  border-bottom: none;
}

.setting-name {
  color: #eee;

  font-size: 14px;
}

.setting-description {
  margin-top: 3px;

  color: #666;

  font-size: 11px;
}

.toggle {
  position: relative;

  width: 48px;
  height: 28px;

  flex-shrink: 0;

  background: #292929;

  border: none;

  border-radius: 20px;

  cursor: pointer;

  transition:
    background .2s;
}

.toggle::after {
  content: "";

  position: absolute;

  top: 4px;
  left: 4px;

  width: 20px;
  height: 20px;

  background: #aaa;

  border-radius: 50%;

  transition:
    transform .2s,
    background .2s;
}

.toggle.active {
  background: #eee;
}

.toggle.active::after {
  transform: translateX(20px);

  background: #111;
}

.no-animations *,
.no-animations *::before,
.no-animations *::after {
  animation: none !important;
  transition: none !important;
}

/* =========================================================
   МУЗЫКАЛЬНЫЙ ПЛЕЕР
========================================================= */

.music-player {
  position: absolute;

  left: 12px;
  right: 12px;

  top: 72px;

  z-index: 5;

  display: none;

  padding: 12px;

  background:
    linear-gradient(
      145deg,
      rgba(30,30,30,.96),
      rgba(10,10,10,.96)
    );

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius: 18px;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.35);
}

.music-player.open {
  display: block;

  animation:
    musicIn .25s ease;
}

@keyframes musicIn {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.music-title {
  color: #fff;

  font-size: 15px;

  font-weight: 700;
}

.music-artist {
  margin-top: 2px;

  color: #777;

  font-size: 12px;
}

.music-liquid {
  position: relative;

  height: 42px;

  margin-top: 10px;

  overflow: hidden;

  background: #151515;

  border-radius: 12px;
}

.music-wave {
  position: absolute;

  left: -20%;

  bottom: -25px;

  width: 140%;
  height: 70px;

  background:
    radial-gradient(
      ellipse,
      rgba(255,255,255,.16),
      transparent 65%
    );

  animation:
    waveMove 3s
    linear
    infinite;
}

@keyframes waveMove {
  from {
    transform: translateX(-8%);
  }

  to {
    transform: translateX(8%);
  }
}

.music-controls {
  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 9px;
}

.music-control {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 36px;
  height: 36px;

  color: #eee;

  background: #202020;

  border: none;

  border-radius: 50%;

  cursor: pointer;
}

.music-control:active {
  transform: scale(.92);
}

<body>

<script>
/* =========================================================

const app =

const input =

const sendButton =
  document.getElementById("sendButton");

  document.getElementById("attachmentMenu");

const choosePhoto =

  document.getElementById("imageInput");

const pendingImage =

  document.getElementById("panelContent");

  document.getElementById("musicPlayer");

  document.getElementById("musicArtist");

  document.getElementById("musicPlay");

const musicClose =
  document.getElementById("musicClose");

/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let started = false;
let waiting = false;
let pendingImageData = null;
let pendingImageUrl = null;
let currentChat = [];

/* =========================================================
   СТАРТ NOA
========================================================= */

function startNOA() {

  if (started) {
    return;
  }

  started = true;

  app.classList.add("started");
}

/* =========================================================
   ДОБАВЛЕНИЕ СООБЩЕНИЯ
========================================================= */

function addMessage(
  text,
  type = "noa"
) {

  if (!text) {
    return null;
  }

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent =
    text;

  messages.appendChild(message);

  messages.scrollTop =
    messages.scrollHeight;

  return message;
}

/* =========================================================
   ИЗОБРАЖЕНИЕ
========================================================= */

function addImageMessage(
  imageUrl,
  caption = ""
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message user";

  wrapper.style.padding =
    "7px";

  const image =
    document.createElement("img");

  image.className =
    "message-image";

  image.src =
    imageUrl;

  image.alt =
    "Изображение";

  wrapper.appendChild(image);

  if (caption) {

    const captionElement =
      document.createElement("div");

    captionElement.className =
      "message-caption";

    captionElement.textContent =
      caption;

    captionElement.style.padding =
      "3px 5px 2px";

    wrapper.appendChild(
      captionElement
    );
  }

  messages.appendChild(wrapper);

  messages.scrollTop =
    messages.scrollHeight;

  return wrapper;
}

/* =========================================================
   ПЕЧАТЬ
========================================================= */

function showTyping() {

  const typing =
    document.createElement("div");

  typing.className =
    "typing";

  typing.id =
    "typingIndicator";

  typing.innerHTML = `
    <span></span>
    <span></span>
    <span></span>
  `;

  messages.appendChild(typing);

  messages.scrollTop =
    messages.scrollHeight;
}

function hideTyping() {

  const typing =
    document.getElementById(
      "typingIndicator"
    );

  if (typing) {
    typing.remove();
  }
}

/* =========================================================
   МЕНЮ
========================================================= */

function openMenu() {

  sideMenu.classList.add("open");

  overlay.classList.add("open");
}

function closeMenuPanel() {

  sideMenu.classList.remove("open");

  overlay.classList.remove("open");
}

menuButton.addEventListener(
  "click",
  openMenu
);

closeMenu.addEventListener(
  "click",
  closeMenuPanel
);

overlay.addEventListener(
  "click",
  closeMenuPanel
);

/* =========================================================
   МЕНЮ ВЛОЖЕНИЙ
========================================================= */

attachmentButton.addEventListener(
  "click",
  () => {

    attachmentMenu.classList.toggle(
      "open"
    );

  }
);

document.addEventListener(
  "click",
  event => {

    if (
      !event.target.closest(
        ".attachment-wrapper"
      )
    ) {

      attachmentMenu.classList.remove(
        "open"
      );

    }

  }
);

choosePhoto.addEventListener(
  "click",
  () => {

    attachmentMenu.classList.remove(
      "open"
    );

    imageInput.click();

  }
);

chooseFile.addEventListener(
  "click",
  () => {

    attachmentMenu.classList.remove(
      "open"
    );

    fileInput.click();

  }
);

/* =========================================================
   IMAGE -> DATA URL
========================================================= */

function fileToDataURL(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );
}

/* =========================================================
   ВЫБОР ФОТО
========================================================= */

imageInput.addEventListener(
  "change",
  async () => {

    const file =
      imageInput.files &&
      imageInput.files[0];

    if (!file) {
      return;
    }

    if (!file.type.startsWith("image/")) {

      addMessage(
        "Можно выбрать только изображение.",
        "error"
      );

      imageInput.value = "";

      return;
    }

    if (file.size > 8 * 1024 * 1024) {

      addMessage(
        "Изображение слишком большое. Максимальный размер — 8 МБ.",
        "error"
      );

      imageInput.value = "";

      return;
    }

    try {

      pendingImageData =
        await fileToDataURL(file);

      if (pendingImageUrl) {

        URL.revokeObjectURL(
          pendingImageUrl
        );

      }

      pendingImageUrl =
        URL.createObjectURL(file);

      pendingImage.src =
        pendingImageUrl;

      pendingAttachment.classList.add(
        "open"
      );

    } catch (error) {

      addMessage(
        "Не удалось загрузить изображение.",
        "error"
      );

    }

    imageInput.value = "";

  }
);

/* =========================================================
   УДАЛИТЬ ФОТО
========================================================= */

removePendingImage.addEventListener(
  "click",
  removePending
);

function removePending() {

  pendingImageData = null;

  if (pendingImageUrl) {

    URL.revokeObjectURL(
      pendingImageUrl
    );

  }

  pendingImageUrl = null;

  pendingImage.removeAttribute(
    "src"
  );

  pendingAttachment.classList.remove(
    "open"
  );
}

/* =========================================================
   ФАЙЛ
========================================================= */

fileInput.addEventListener(
  "change",
  () => {

    const file =
      fileInput.files &&
      fileInput.files[0];

    if (!file) {
      return;
    }

    addMessage(
      "Файл «" +
      file.name +
      "» выбран. Для отправки содержимого этого файла требуется соответствующая обработка на сервере.",
      "user"
    );

    fileInput.value = "";

    if (!started) {
      requestAnimationFrame(
        startNOA
      );
    }

  }
);

/* =========================================================
   ИСТОРИЯ
========================================================= */

function getHistory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "noa_history"
      ) || "[]"
    );

  } catch {

    return [];

  }
}

function saveHistory() {

  if (
    currentChat.length === 0
  ) {
    return;
  }

  const history =
    getHistory();

  history.unshift({
    date:
      new Date().toLocaleString(
        "ru-RU"
      ),
    messages:
      currentChat.slice()
  });

  localStorage.setItem(
    "noa_history",
    JSON.stringify(
      history.slice(0, 30)
    )
  );
}

function rememberMessage(
  role,
  text
) {

  currentChat.push({
    role,
    text,
    time:
      Date.now()
  });
}

/* =========================================================
   НОВЫЙ ЧАТ
========================================================= */

document.getElementById(
  "newChat"
).addEventListener(
  "click",
  () => {

    saveHistory();

    currentChat = [];

    messages.innerHTML = "";

    input.value = "";

    input.style.height =
      "42px";

    removePending();

    hideMusicPlayer();

    closeMenuPanel();

  }
);

/* =========================================================
   ПАНЕЛИ
========================================================= */

function openPanel(
  title,
  html
) {

  panelTitle.textContent =
    title;

  panelContent.innerHTML =
    html;

  panelOverlay.classList.add(
    "open"
  );

  closeMenuPanel();
}

function closePanel() {

  panelOverlay.classList.remove(
    "open"
  );
}

panelClose.addEventListener(
  "click",
  closePanel
);

panelOverlay.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      panelOverlay
    ) {

      closePanel();

    }

  }
);

/* =========================================================
   ИСТОРИЯ
========================================================= */

document.getElementById(
  "historyButton"
).addEventListener(
  "click",
  () => {

    const history =
      getHistory();

    if (
      history.length === 0
    ) {

      openPanel(
        "История запросов",
        `
          <div class="panel-card">
            <div class="panel-card-title">
              Пока пусто
            </div>

            <div class="panel-card-text">
              Здесь будут сохраняться предыдущие чаты NOA.
            </div>
          </div>
        `
      );

      return;
    }

    const container =
      document.createElement(
        "div"
      );

    container.className =
      "history-list";

    history.forEach(
      chat => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "history-item";

        const first =
          chat.messages &&
          chat.messages.find(
            item =>
              item.role === "user"
          );

        const title =
          first?.text ||
          "Новый чат";

        button.innerHTML = `
          <div class="history-item-title">
            ${escapeHtml(title)}
          </div>

          <div class="history-item-date">
            ${escapeHtml(chat.date || "")}
          </div>
        `;

        button.addEventListener(
          "click",
          () => {

            loadHistoryChat(
              chat
            );

            closePanel();

          }
        );

        container.appendChild(
          button
        );

      }
    );

    panelTitle.textContent =
      "История запросов";

    panelContent.innerHTML = "";

    panelContent.appendChild(
      container
    );

    panelOverlay.classList.add(
      "open"
    );

    closeMenuPanel();

  }
);

/* =========================================================
   ЗАГРУЗКА ИСТОРИИ
========================================================= */

function loadHistoryChat(
  chat
) {

  messages.innerHTML = "";

  currentChat = [];

  if (
    !chat ||
    !Array.isArray(
      chat.messages
    )
  ) {
    return;
  }

  chat.messages.forEach(
    item => {

      if (
        item.role === "user"
      ) {

        addMessage(
          item.text,
          "user"
        );

      } else {

        addMessage(
          item.text,
          "noa"
        );

      }

      currentChat.push({
        role: item.role,
        text: item.text,
        time: item.time
      });

    }
  );

  startNOA();
}

/* =========================================================
   ПРОЕКТЫ
========================================================= */

document.getElementById(
  "projectsButton"
).addEventListener(
  "click",
  () => {

    openPanel(
      "Проекты",
      `
        <div class="project-card">

          <div class="project-name">
            NOA
          </div>

          <div class="project-description">
            Твой персональный AI-проект с собственным интерфейсом, историей и будущими функциями.
          </div>

        </div>

        <div class="project-card">

          <div class="project-name">
            Новые проекты
          </div>

          <div class="project-description">
            Здесь можно будет создавать и хранить отдельные проекты внутри NOA.
          </div>

        </div>
      `
    );

  }
);

/* =========================================================
   ТАРИФЫ
========================================================= */

document.getElementById(
  "plansButton"
).addEventListener(
  "click",
  () => {

    openPanel(
      "NOA",
      `
        <div class="plan">

          <div class="plan-name">
            NOA Lite
          </div>

          <div class="plan-price">
            $0.49
          </div>

          <div class="plan-description">
            Расширенные возможности NOA.
          </div>

          <button
            class="panel-button"
            type="button"
          >
            Приобрести
          </button>

        </div>

        <div class="plan">

          <div class="plan-name">
            NOA Plus
          </div>

          <div class="plan-price">
            $0.99
          </div>

          <div class="plan-description">
            Больше возможностей и более высокий приоритет.
          </div>

          <button
            class="panel-button"
            type="button"
          >
            Приобрести
          </button>

        </div>

        <div class="plan">

          <div class="plan-name">
            NOA Premium
          </div>

          <div class="plan-price">
            $1.99
          </div>

          <div class="plan-description">
            Максимальный набор возможностей NOA.
          </div>

          <button
            class="panel-button"
            type="button"
          >
            Приобрести
          </button>

        </div>
      `
    );

  }
);

/* =========================================================
   УВЕДОМЛЕНИЯ
========================================================= */

document.getElementById(
  "notificationsButton"
).addEventListener(
  "click",
  () => {

    openPanel(
      "Уведомления",
      `
        <div class="notification">

          <div class="notification-title">
            NOA
          </div>

          <div class="notification-text">
            Здесь будут отображаться уведомления от NOA.
          </div>

        </div>
      `
    );

  }
);

/* =========================================================
   НАСТРОЙКИ
========================================================= */

document.getElementById(
  "settingsButton"
).addEventListener(
  "click",
  () => {

    openPanel(
      "Настройки",
      `
        <div class="setting-row">

          <div>
            <div class="setting-name">
              Анимации
            </div>

            <div class="setting-description">
              Плавные переходы интерфейса.
            </div>
          </div>

          <button
            class="toggle active"
            id="animationsToggle"
            type="button"
          ></button>

        </div>

        <div class="setting-row">

          <div>
            <div class="setting-name">
              Автосохранение истории
            </div>

            <div class="setting-description">
              Сохранять предыдущие чаты.
            </div>
          </div>

          <button
            class="toggle active"
            id="historyToggle"
            type="button"
          ></button>

        </div>
      `
    );

    const animationsToggle =
      document.getElementById(
        "animationsToggle"
      );

    const historyToggle =
      document.getElementById(
        "historyToggle"
      );

    animationsToggle?.addEventListener(
      "click",
      () => {

        animationsToggle.classList.toggle(
          "active"
        );

        document.body.classList.toggle(
          "no-animations"
        );

      }
    );

    historyToggle?.addEventListener(
      "click",
      () => {

        historyToggle.classList.toggle(
          "active"
        );

        localStorage.setItem(
          "noa_save_history",
          historyToggle.classList.contains(
            "active"
          )
            ? "1"
            : "0"
        );

      }
    );

  }
);

/* =========================================================
   ПРАВИЛА
========================================================= */

document.getElementById(
  "rulesButton"
).addEventListener(
  "click",
  () => {

    openPanel(
      "Правила использования",
      `
        <div class="panel-card">

          <div class="panel-card-title">
            Использование NOA
          </div>

          <div class="panel-card-text">
            Используй NOA ответственно и не отправляй личные данные, которые не хочешь передавать сервису.
          </div>

        </div>

        <div class="panel-card">

          <div class="panel-card-title">
            Ответы NOA
          </div>

          <div class="panel-card-text">
            Ответы AI могут содержать ошибки. Важную информацию необходимо проверять.
          </div>

        </div>
      `
    );

  }
);

/* =========================================================
   MUSIC
========================================================= */

let musicIsPlaying =
  false;

function showMusicPlayer(
  title = "Pretty Savage",
  artist = "BLACKPINK"
) {

  musicTitle.textContent =
    title;

  musicArtist.textContent =
    artist;

  musicPlayer.classList.add(
    "open"
  );
}

function hideMusicPlayer() {

  musicPlayer.classList.remove(
    "open"
  );

  musicIsPlaying = false;

  musicPlay.textContent =
    "▶";
}

musicClose.addEventListener(
  "click",
  hideMusicPlayer
);

musicPlay.addEventListener(
  "click",
  () => {

    musicIsPlaying =
      !musicIsPlaying;

    musicPlay.textContent =
      musicIsPlaying
        ? "Ⅱ"
        : "▶";

  }
);

/* =========================================================
   МУЗЫКАЛЬНЫЕ КОМАНДЫ
========================================================= */

function detectMusicCommand(
  text
) {

  const value =
    text
      .toLowerCase()
      .trim();

  if (
    value.includes(
      "pretty savage"
    ) &&
    value.includes(
      "blackpink"
    )
  ) {

    return {
      title:
        "Pretty Savage",

      artist:
        "BLACKPINK"
    };

  }

  if (
    value.includes(
      "pretty savage"
    )
  ) {

    return {
      title:
        "Pretty Savage",

      artist:
        "BLACKPINK"
    };

  }

  if (
    value.includes("включи") &&
    value.includes("музык")
  ) {

    return {
      title:
        "Музыка",

      artist:
        "NOA"
    };

  }

  return null;
}

/* =========================================================
   ЭКРАНИРОВАНИЕ
========================================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

/* =========================================================
   ОТПРАВКА
========================================================= */

inputForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    if (waiting) {
      return;
    }

    const text =
      input.value.trim();

    const imageData =
      pendingImageData;

    const imageUrl =
      pendingImageUrl;

    if (
      !text &&
      !imageData
    ) {
      return;
    }

    /*
      МУЗЫКА
    */

    const musicCommand =
      detectMusicCommand(
        text
      );

    if (
      musicCommand &&
      !imageData
    ) {

      closeMenuPanel();

      attachmentMenu.classList.remove(
        "open"
      );

      addMessage(
        text,
        "user"
      );

      rememberMessage(
        "user",
        text
      );

      input.value = "";

      input.style.height =
        "42px";

      requestAnimationFrame(
        () => {

          startNOA();

          showMusicPlayer(
            musicCommand.title,
            musicCommand.artist
          );

        }
      );

      return;
    }

    /*
      ОБЫЧНЫЙ ЗАПРОС
    */

    closeMenuPanel();

    attachmentMenu.classList.remove(
      "open"
    );

    if (imageData) {

      addImageMessage(
        imageUrl,
        text
      );

      rememberMessage(
        "user",
        text ||
        "[изображение]"
      );

    } else {

      addMessage(
        text,
        "user"
      );

      rememberMessage(
        "user",
        text
      );

    }

    requestAnimationFrame(
      () => {
        startNOA();
      }
    );

    input.value = "";

    input.style.height =
      "42px";

    removePending();

    waiting = true;

    sendButton.disabled =
      true;

    attachmentButton.disabled =
      true;

    showTyping();

    try {

      const payload = {
        message: text
      };

      if (imageData) {

        payload.image =
          imageData;

      }

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );

      let data = null;

      try {

        data =
          await response.json();

      } catch {

        data = null;

      }

      hideTyping();

      if (
        !response.ok
      ) {

        throw new Error(
          data?.error ||
          "Ошибка сервера"
        );

      }

      const reply =
        data?.reply ??
        data?.response ??
        data?.message ??
        "";

      if (!reply) {

        addMessage(
          "NOA не смог сформировать ответ.",
          "error"
        );

        rememberMessage(
          "noa",
          "NOA не смог сформировать ответ."
        );

      } else {

        addMessage(
          String(reply),
          "noa"
        );

        rememberMessage(
          "noa",
          String(reply)
        );

      }

      if (
        localStorage.getItem(
          "noa_save_history"
        ) !== "0"
      ) {

        saveHistory();

      }

    } catch (error) {

      hideTyping();

      console.error(
        "NOA /api/chat error:",
        error
      );

      const errorText =
        "Не удалось подключиться к NOA. Попробуйте ещё раз.";

      addMessage(
        errorText,
        "error"
      );

      rememberMessage(
        "noa",
        errorText
      );

    } finally {

      waiting = false;

      sendButton.disabled =
        false;

      attachmentButton.disabled =
        false;

      input.focus();

    }

  }
);

/* =========================================================
   AUTO RESIZE TEXTAREA
========================================================= */

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "42px";

    input.style.height =
      Math.min(
        input.scrollHeight,
        130
      ) + "px";

  }
);

/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      inputForm.requestSubmit();

    }

  }
);

/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeMenuPanel();

      closePanel();

      attachmentMenu.classList.remove(
        "open"
      );

    }

  }
);

/* =========================================================
   СОХРАНЕНИЕ ПРИ ЗАКРЫТИИ
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (
      currentChat.length > 0 &&
      localStorage.getItem(
        "noa_save_history"
      ) !== "0"
    ) {

      saveHistory();

    }

  }
);

/* =========================================================
   ПЕРВИЧНЫЕ НАСТРОЙКИ
========================================================= */

if (
  localStorage.getItem(
    "noa_save_history"
  ) === null
) {

  localStorage.setItem(
    "noa_save_history",
    "1"
  );

}

/*
  startNOA() здесь специально НЕ вызывается.
  Большой логотип показывается при запуске,
  но благодаря прозрачному слою интерфейс
  уже доступен.
*/

input.style.height =
  "42px";
