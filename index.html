
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NOA</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, textarea {
  font: inherit;
}

.app {
  position: relative;
  width: 100%;
  max-width: 900px;
  height: 100%;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  background: #000;
}

/* ===== СТАРТОВЫЙ ЭКРАН ===== */

.logo-screen {
  position: absolute;
  inset: 0;
  z-index: 10;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
  pointer-events: none;

  transition:
    transform .85s cubic-bezier(.22,.61,.36,1),
    opacity .65s ease;
}

.logo {
  position: relative;
  z-index: 1;

  margin: 0;
  padding: 0;
  border: none;
  outline: none;
  box-shadow: none;

  font-size: clamp(76px, 20vw, 150px);
  font-weight: 800;
  letter-spacing: -.075em;
  line-height: 1;

  background: linear-gradient(
    180deg,
    #fff 0%,
    #dedede 35%,
    #898989 68%,
    #f4f4f4 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;

  filter: drop-shadow(0 0 28px rgba(255,0,0,.12));

  animation: appear 1s ease both;
}

.red-glow {
  position: absolute;
  top: 50%;
  left: 50%;

  width: min(85vw, 380px);
  aspect-ratio: 1;

  transform: translate(-50%, -50%);

  background: radial-gradient(
    circle,
    rgba(180,0,0,.12),
    rgba(100,0,0,.035) 45%,
    transparent 72%
  );
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.app.started .logo-screen {
  transform: translateY(-100%);
  opacity: 0;
}

/* ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== */

.chat {
  position: absolute;
  inset: 0;
  z-index: 15;

  display: flex;
  flex-direction: column;

  background: transparent;
}

/* Верхняя панель */

.topbar {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: center;

  flex-shrink: 0;
  height: 62px;

  padding: 0 14px;

  background: rgba(0,0,0,.45);
  border-bottom: 1px solid rgba(255,255,255,.055);
}

.menu-button {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 44px;
  height: 44px;
  padding: 0;

  color: #eee;
  background: transparent;
  border: none;
  border-radius: 12px;

  font-size: 27px;
  cursor: pointer;
}

.menu-button:active {
  background: #191919;
}

.topbar-logo {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.04em;

  background: linear-gradient(180deg, #fff, #999);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Сообщения */

.messages {
  flex: 1;
  min-height: 0;

  overflow-y: auto;
  overscroll-behavior: contain;

  padding: 22px 15px 20px;

  scrollbar-width: thin;
  scrollbar-color: #292929 transparent;
}

.message {
  width: fit-content;
  max-width: min(85%, 650px);

  margin: 0 0 14px;
  padding: 12px 15px;

  border-radius: 18px;

  font-size: 16px;
  line-height: 1.5;

  white-space: pre-wrap;
  overflow-wrap: anywhere;

  animation: messageIn .2s ease;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user {
  margin-left: auto;

  color: #fff;
  background: #191919;

  border: 1px solid rgba(255,255,255,.07);
  border-bottom-right-radius: 6px;
}

.message.noa {
  margin-right: auto;
  padding-left: 2px;

  color: #e8e8e8;
  background: transparent;
}

.message.error {
  color: #ff7777;
}

/* ===== ПОЛЕ ВВОДА ===== */

.input-area {
  position: relative;
  z-index: 2;

  flex-shrink: 0;

  padding:
    12px
    12px
    calc(12px + env(safe-area-inset-bottom));

  background: linear-gradient(
    to top,
    #000 70%,
    rgba(0,0,0,.88)
  );
}

.input-box {
  display: flex;
  align-items: flex-end;
  gap: 8px;

  width: 100%;
  padding: 7px 8px 7px 14px;

  background: #111;
  border: 1px solid #292929;
  border-radius: 25px;

  box-shadow: 0 0 22px rgba(255,0,0,.035);
}

textarea {
  display: block;
  flex: 1;
  min-width: 0;

  min-height: 42px;
  max-height: 130px;
  padding: 11px 0;

  resize: none;
  overflow-y: auto;

  color: #fff;
  caret-color: #fff;

  background: transparent;
  border: none;
  outline: none;

  font-size: 16px;
  line-height: 20px;
}

textarea::placeholder {
  color: #858585;
  opacity: 1;
}

.send {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 42px;
  height: 42px;
  flex-shrink: 0;

  color: #000;
  background: #f5f5f5;

  border: none;
  border-radius: 50%;

  font-size: 25px;
  line-height: 1;
  cursor: pointer;
}

.send:active {
  transform: scale(.93);
}

.send:disabled {
  opacity: .4;
}

/* ===== ИНДИКАТОР ОТВЕТА ===== */

.typing {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 12px 4px;
}

.typing span {
  width: 6px;
  height: 6px;

  border-radius: 50%;
  background: #888;

  animation: pulse 1.1s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes pulse {
  0%, 60%, 100% {
    opacity: .35;
    transform: translateY(0);
  }
  30% {
    opacity: 1;
    transform: translateY(-4px);
  }
}

/* ===== БОКОВОЕ МЕНЮ ===== */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 25;

  background: rgba(0,0,0,.65);

  opacity: 0;
  visibility: hidden;

  transition: opacity .25s, visibility .25s;
}

.overlay.open {
  opacity: 1;
  visibility: visible;
}

.side-menu {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 30;

  width: min(290px, 82vw);

  padding-top: env(safe-area-inset-top);

  background: #0a0a0a;
  border-right: 1px solid #242424;

  transform: translateX(-101%);
  transition: transform .28s ease;

  overflow-y: auto;
}

.side-menu.open {
  transform: translateX(0);
}

.menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  height: 62px;
  padding: 0 18px;

  border-bottom: 1px solid #222;
}

.menu-brand {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.04em;

  background: linear-gradient(#fff, #999);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.close-menu {
  width: 38px;
  height: 38px;

  color: #ddd;
  background: transparent;
  border: none;
  border-radius: 10px;

  font-size: 25px;
  cursor: pointer;
}

.menu-item {
  display: block;
  width: 100%;

  padding: 17px 20px;

  color: #ccc;
  background: transparent;

  border: none;
  border-bottom: 1px solid rgba(255,255,255,.045);

  text-align: left;
  font-size: 15px;

  cursor: pointer;
}

.menu-item:active {
  background: #181818;
}

.menu-note {
  padding: 18px 20px;
  color: #666;
  font-size: 12px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<div class="app" id="app">

  <!-- Стартовый экран -->

  <div class="logo-screen">
    <div class="red-glow"></div>
    <div class="logo">NOA</div>
  </div>

  <!-- Интерфейс чата -->

  <main class="chat">

    <header class="topbar">
      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Открыть меню"
      >☰</button>

      <div class="topbar-logo">NOA</div>
    </header>

    <div
      class="messages"
      id="messages"
      aria-live="polite"
    ></div>

    <form class="input-area" id="chatForm">
      <div class="input-box">

        <textarea
          id="input"
          rows="1"
          placeholder="Напишите сообщение..."
          aria-label="Сообщение"
        ></textarea>

        <button
          class="send"
          id="send"
          type="submit"
          aria-label="Отправить"
        >↑</button>

      </div>
    </form>

  </main>

  <!-- Боковое меню -->

  <div class="overlay" id="overlay"></div>

  <aside class="side-menu" id="sideMenu">

    <div class="menu-header">
      <span class="menu-brand">NOA</span>

      <button
        class="close-menu"
        id="closeMenu"
        type="button"
        aria-label="Закрыть меню"
      >×</button>
    </div>

    <button class="menu-item" id="newChat" type="button">
      ＋ Новый чат
    </button>

    <div class="menu-item">История</div>
    <div class="menu-item">Настройки</div>

    <div class="menu-note">NOA</div>

  </aside>

</div>

<script>
const app = document.getElementById("app");
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const send = document.getElementById("send");
const chatForm = document.getElementById("chatForm");

const sideMenu = document.getElementById("sideMenu");
const overlay = document.getElementById("overlay");

let started = false;
let waiting = false;

function startNOA() {
  if (!started) {
    started = true;
    app.classList.add("started");
  }
}

function addMessage(text, type) {
  const el = document.createElement("div");

  el.className = "message " + type;
  el.textContent = text;

  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;

  return el;
}

function showTyping() {
  const el = document.createElement("div");

  el.className = "message noa";
  el.id = "typing";

  el.innerHTML =
    '<div class="typing">' +
    '<span></span><span></span><span></span>' +
    '</div>';

  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  document.getElementById("typing")?.remove();
}

function openMenu() {
  sideMenu.classList.add("open");
  overlay.classList.add("open");
}

function closeMenu() {
  sideMenu.classList.remove("open");
  overlay.classList.remove("open");
}

document.getElementById("menuButton")
  .addEventListener("click", openMenu);

document.getElementById("closeMenu")
  .addEventListener("click", closeMenu);

overlay.addEventListener("click", closeMenu);

document.getElementById("newChat")
  .addEventListener("click", () => {
    messages.replaceChildren();
    input.value = "";
    input.style.height = "42px";
    closeMenu();
    input.focus();
  });

chatForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const text = input.value.trim();

  if (!text || waiting) return;

  startNOA();
  closeMenu();

  addMessage(text, "user");

  input.value = "";
  input.style.height = "42px";

  waiting = true;
  send.disabled = true;

  showTyping();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    const answer =
      data.reply ??
      data.response ??
      data.message ??
      data.text;

    if (typeof answer !== "string" || !answer.trim()) {
      throw new Error("Пустой ответ сервера");
    }

    removeTyping();
    addMessage(answer, "noa");

  } catch (error) {
    removeTyping();

    addMessage(
      "NOA не смог сформировать ответ. Попробуй ещё раз.",
      "noa error"
    );

    console.error("NOA error:", error);

  } finally {
    waiting = false;
    send.disabled = false;
  }
});

input.addEventListener("input", () => {
  input.style.height = "42px";
  input.style.height =
    Math.min(input.scrollHeight, 130) + "px";
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    chatForm.requestSubmit();
  }
});
</script>

</body>
</html>
