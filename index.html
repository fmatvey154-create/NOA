<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>НОА — нейронная система</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #ffffff;
      color: #111111;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
    }

    /* Боковая панель */

    .sidebar {
      width: 250px;
      border-right: 1px solid #e8e8e8;
      padding: 22px;
      display: flex;
      flex-direction: column;
      background: #fafafa;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 35px;
    }

    .logo span {
      background: linear-gradient(135deg, #00aaff, #7b5cff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .new-chat {
      border: none;
      background: #111;
      color: white;
      padding: 13px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }

    .new-chat:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .sidebar-bottom {
      margin-top: auto;
      color: #777;
      font-size: 13px;
    }

    /* Основная часть */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid #eeeeee;
      display: flex;
      align-items: center;
      padding: 0 30px;
      font-weight: 600;
    }

    .status {
      margin-left: auto;
      font-size: 13px;
      color: #888;
      font-weight: normal;
    }

    /* Чат */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px;
    }

    .welcome {
      max-width: 700px;
      margin: 12vh auto 0;
      text-align: center;
    }

    .welcome h1 {
      font-size: 46px;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }

    .gradient-text {
      background: linear-gradient(135deg, #00aaff, #7b5cff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: #777;
      font-size: 17px;
    }

    .message {
      max-width: 750px;
      margin: 0 auto 25px;
      display: flex;
      gap: 14px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00aaff, #7b5cff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message-content {
      padding-top: 7px;
      line-height: 1.5;
    }

    /* Поле ввода */

    .input-area {
      padding: 18px 25px 25px;
    }

    .input-box {
      max-width: 750px;
      margin: auto;
      border: 1px solid #dddddd;
      border-radius: 18px;
      padding: 8px;
      display: flex;
      align-items: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
      background: white;
    }

    .input-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 13px;
      font-size: 15px;
    }

    .send {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }

    .send:hover {
      background: #333;
      transform: scale(1.03);
    }

    /* Телефон */

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 18px;
      }

      .welcome h1 {
        font-size: 38px;
      }

      .chat {
        padding: 25px 15px;
      }

      .input-area {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      <span>НОА</span>
    </div>

    <button class="new-chat" onclick="newChat()">
      + Новый чат
    </button>

    <div class="sidebar-bottom">
      НОА AI · версия 0.1
    </div>

  </aside>


  <main class="main">

    <header class="topbar">
      НОА
      <div class="status">
        Онлайн
      </div>
    </header>


    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <h1>
          Привет, я <span class="gradient-text">НОА</span>
        </h1>

        <p>
          Твоя новая нейронная система.
        </p>

      </div>

    </section>


    <div class="input-area">

      <form class="input-box" onsubmit="sendMessage(event)">

        <input
          id="messageInput"
          type="text"
          placeholder="Напиши сообщение НОА..."
          autocomplete="off"
        >

        <button class="send" type="submit">
          ↑
        </button>

      </form>

    </div>

  </main>

</div>


<script>

function sendMessage(event) {

  event.preventDefault();

  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  const text = input.value.trim();

  if (!text) return;

  if (welcome) {
    welcome.remove();
  }

  // Сообщение пользователя

  const userMessage = document.createElement("div");

  userMessage.className = "message";

  userMessage.innerHTML = `
    <div class="avatar">Я</div>
    <div class="message-content">
      ${escapeHTML(text)}
    </div>
  `;

  chat.appendChild(userMessage);

  input.value = "";

  chat.scrollTop = chat.scrollHeight;


  // Временный ответ НОА

  setTimeout(() => {

    const aiMessage = document.createElement("div");

    aiMessage.className = "message";

    aiMessage.innerHTML = `
      <div class="avatar">Н</div>
      <div class="message-content">
        Я пока работаю в демонстрационном режиме 🤖
        <br><br>
        Скоро сюда подключим настоящую нейросеть.
      </div>
    `;

    chat.appendChild(aiMessage);

    chat.scrollTop = chat.scrollHeight;

  }, 600);

}


function newChat() {

  const chat = document.getElementById("chat");

  chat.innerHTML = `
    <div class="welcome" id="welcome">

      <h1>
        Привет, я <span class="gradient-text">НОА</span>
      </h1>

      <p>
        Твоя новая нейронная система.
      </p>

    </div>
  `;

}


function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
