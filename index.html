<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NOA</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Segoe UI", sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
}

.app {
  position: relative;
  width: 100%;
  max-width: 520px;
  height: 100%;
  background: #000;
  overflow: hidden;
}

/* ===== СТАРТОВЫЙ ЭКРАН ===== */

.start-screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition:
    transform 0.9s cubic-bezier(.22,.61,.36,1),
    opacity 0.7s ease;
}

.start-screen.hide {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}

.start-logo {
  font-size: 72px;
  font-weight: 300;
  letter-spacing: 8px;
  color: #d8d8d8;
  text-shadow:
    0 0 8px rgba(255,255,255,.15),
    0 0 25px rgba(255,255,255,.08);
}

/* ===== ОСНОВНОЙ ЭКРАН ===== */

.main {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: #000;
}

/* ===== TOPBAR ===== */

.topbar {
  height: 58px;
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  border-bottom: 1px solid rgba(255,255,255,.06);
  padding-top: env(safe-area-inset-top);
}

.top-title {
  font-size: 18px;
  font-weight: 500;
  letter-spacing: .5px;
}

.menu-button {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* ===== CHAT ===== */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px 15px 130px;
  scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
  display: none;
}

.message {
  width: 100%;
  display: flex;
  margin: 9px 0;
}

.message.user {
  justify-content: flex-end;
}

.message.noa {
  justify-content: flex-start;
}

.bubble {
  max-width: 84%;
  padding: 11px 14px;
  border-radius: 18px;
  font-size: 16px;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user .bubble {
  background: #1d1d1f;
  border-bottom-right-radius: 6px;
}

.message.noa .bubble {
  background: #111;
  border: 1px solid rgba(255,255,255,.06);
  border-bottom-left-radius: 6px;
}

.message-image {
  max-width: 230px;
  max-height: 300px;
  display: block;
  border-radius: 15px;
  object-fit: cover;
  margin-bottom: 7px;
}

/* ===== TYPING ===== */

.typing {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 48px;
}

.typing span {
  width: 6px;
  height: 6px;
  background: #aaa;
  border-radius: 50%;
  animation: typing 1.2s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes typing {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: .35;
  }
  30% {
    transform: translateY(-4px);
    opacity: 1;
  }
}

/* ===== INPUT AREA ===== */

.input-wrap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding:
    10px 12px
    calc(10px + env(safe-area-inset-bottom))
    12px;
  background: linear-gradient(
    to top,
    #000 70%,
    rgba(0,0,0,.92) 85%,
    rgba(0,0,0,0)
  );
}

.input-box {
  min-height: 52px;
  border-radius: 27px;
  background: #171717;
  border: 1px solid rgba(255,255,255,.07);
  display: flex;
  align-items: flex-end;
  padding: 6px;
}

#input {
  flex: 1;
  border: 0;
  outline: none;
  resize: none;
  background: transparent;
  color: #fff;
  font-size: 16px;
  line-height: 22px;
  padding: 9px 7px;
  max-height: 120px;
  font-family: inherit;
}

#input::placeholder {
  color: #777;
}

.action-button {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  border: 0;
  border-radius: 50%;
  background: #252525;
  color: #fff;
  font-size: 19px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}

.action-button:active {
  transform: scale(.9);
  background: #333;
}

/* ===== ATTACHMENT MENU ===== */

.attach-menu {
  position: absolute;
  left: 12px;
  bottom: 70px;
  width: 190px;
  background: rgba(25,25,25,.97);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 17px;
  padding: 7px;
  opacity: 0;
  transform: translateY(8px) scale(.97);
  pointer-events: none;
  transition: .18s ease;
  box-shadow: 0 12px 35px rgba(0,0,0,.45);
}

.attach-menu.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.attach-option {
  width: 100%;
  height: 43px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: #fff;
  text-align: left;
  padding: 0 12px;
  font-size: 15px;
  cursor: pointer;
}

.attach-option:active {
  background: #333;
}

/* ===== SIDE MENU ===== */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: rgba(0,0,0,.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}

.overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.side-menu {
  position: absolute;
  z-index: 11;
  left: 0;
  top: 0;
  bottom: 0;
  width: 72%;
  max-width: 350px;
  background: #0d0d0d;
  border-right: 1px solid rgba(255,255,255,.07);
  transform: translateX(-100%);
  transition: transform .3s cubic-bezier(.22,.61,.36,1);
  padding:
    calc(18px + env(safe-area-inset-top))
    14px
    calc(18px + env(safe-area-inset-bottom));
}

.side-menu.show {
  transform: translateX(0);
}

.side-title {
  font-size: 22px;
  font-weight: 500;
  margin: 5px 8px 25px;
}

.side-button {
  width: 100%;
  min-height: 48px;
  border: 0;
  border-radius: 13px;
  background: transparent;
  color: #fff;
  text-align: left;
  padding: 0 13px;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 4px;
}

.side-button:active {
  background: #1c1c1c;
}

.side-noa {
  position: absolute;
  left: 22px;
  bottom: calc(22px + env(safe-area-inset-bottom));
  color: #666;
  font-size: 14px;
  letter-spacing: 2px;
}

/* ===== HIDDEN INPUTS ===== */

.hidden-input {
  display: none;
}

/* ===== IMAGE PREVIEW ===== */

.preview-image {
  max-width: 230px;
  max-height: 300px;
  border-radius: 15px;
  display: block;
  object-fit: cover;
}
</style>
</head>

<body>

<div class="app">

  <!-- START -->
  <div class="start-screen" id="startScreen">
    <div class="start-logo">NOA</div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <button class="menu-button" id="menuButton">☰</button>
      <div class="top-title">NOA</div>
    </div>

    <!-- CHAT -->
    <div class="chat" id="chat"></div>

    <!-- INPUT -->
    <div class="input-wrap">

      <!-- ATTACHMENT MENU -->
      <div class="attach-menu" id="attachMenu">

        <button class="attach-option" id="photoOption">
          🖼️ Фото
        </button>

        <button class="attach-option" id="cameraOption">
          📷 Камера
        </button>

        <button class="attach-option" id="fileOption">
          📄 Файл
        </button>

      </div>

      <div class="input-box">

        <button class="action-button" id="attachButton">
          🖼️
        </button>

        <textarea
          id="input"
          rows="1"
          placeholder="Сообщение..."
          autocomplete="off"
          autocorrect="on"
          spellcheck="true"
        ></textarea>

        <button class="action-button" id="sendButton">
          ↑
        </button>

      </div>
    </div>

  </div>

  <!-- SIDE MENU -->
  <div class="overlay" id="overlay"></div>

  <aside class="side-menu" id="sideMenu">

    <div class="side-title">NOA</div>

    <button class="side-button" id="newChatButton">
      ＋ Новый чат
    </button>

    <button class="side-button" id="historyButton">
      🕘 История
    </button>

    <button class="side-button" id="settingsButton">
      ⚙️ Настройки
    </button>

    <div class="side-noa">
      NOA
    </div>

  </aside>

  <!-- FILE INPUTS -->
  <input
    class="hidden-input"
    id="photoInput"
    type="file"
    accept="image/*"
  >

  <input
    class="hidden-input"
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <input
    class="hidden-input"
    id="fileInput"
    type="file"
  >

</div>

<script>
/* =========================
   ELEMENTS
========================= */

const startScreen = document.getElementById("startScreen");
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");

const attachButton = document.getElementById("attachButton");
const attachMenu = document.getElementById("attachMenu");

const photoOption = document.getElementById("photoOption");
const cameraOption = document.getElementById("cameraOption");
const fileOption = document.getElementById("fileOption");

const photoInput = document.getElementById("photoInput");
const cameraInput = document.getElementById("cameraInput");
const fileInput = document.getElementById("fileInput");

const menuButton = document.getElementById("menuButton");
const sideMenu = document.getElementById("sideMenu");
const overlay = document.getElementById("overlay");

const newChatButton = document.getElementById("newChatButton");
const historyButton = document.getElementById("historyButton");
const settingsButton = document.getElementById("settingsButton");

let waiting = false;


/* =========================
   START SCREEN
========================= */

setTimeout(() => {
  startScreen.classList.add("hide");
}, 900);


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, type) {

  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  bubble.textContent = text;

  message.appendChild(bubble);
  chat.appendChild(message);

  scrollChat();
}


/* =========================
   ADD IMAGE MESSAGE
========================= */

function addImageMessage(imageUrl, text = "") {

  const message = document.createElement("div");
  message.className = "message user";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const image = document.createElement("img");
  image.className = "message-image";
  image.src = imageUrl;

  bubble.appendChild(image);

  if (text) {

    const caption = document.createElement("div");

    caption.textContent = text;

    caption.style.marginTop = "5px";

    bubble.appendChild(caption);
  }

  message.appendChild(bubble);

  chat.appendChild(message);

  scrollChat();

  return message;
}


/* =========================
   TYPING
========================= */

function showTyping() {

  const message = document.createElement("div");

  message.className = "message noa";
  message.id = "typingMessage";

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  bubble.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  message.appendChild(bubble);

  chat.appendChild(message);

  scrollChat();
}


function hideTyping() {

  const typing = document.getElementById("typingMessage");

  if (typing) {
    typing.remove();
  }
}


/* =========================
   SCROLL
========================= */

function scrollChat() {

  setTimeout(() => {
    chat.scrollTop = chat.scrollHeight;
  }, 30);
}


/* =========================
   INPUT AUTO RESIZE
========================= */

input.addEventListener("input", () => {

  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight, 120) + "px";
});


/* =========================
   ATTACHMENT MENU
========================= */

attachButton.addEventListener("click", (event) => {

  event.stopPropagation();

  attachMenu.classList.toggle("show");
});


document.addEventListener("click", (event) => {

  if (
    !attachMenu.contains(event.target) &&
    event.target !== attachButton
  ) {
    attachMenu.classList.remove("show");
  }

});


/* =========================
   PHOTO
========================= */

photoOption.addEventListener("click", () => {

  attachMenu.classList.remove("show");

  photoInput.click();

});


/* =========================
   CAMERA
========================= */

cameraOption.addEventListener("click", () => {

  attachMenu.classList.remove("show");

  cameraInput.click();

});


/* =========================
   FILE
========================= */

fileOption.addEventListener("click", () => {

  attachMenu.classList.remove("show");

  fileInput.click();

});


/* =========================
   PHOTO INPUT
========================= */

photoInput.addEventListener("change", () => {

  if (photoInput.files && photoInput.files[0]) {

    handleAttachment(photoInput.files[0]);

  }

  photoInput.value = "";

});


/* =========================
   CAMERA INPUT
========================= */

cameraInput.addEventListener("change", () => {

  if (cameraInput.files && cameraInput.files[0]) {

    handleAttachment(cameraInput.files[0]);

  }

  cameraInput.value = "";

});


/* =========================
   FILE INPUT
========================= */

fileInput.addEventListener("change", () => {

  if (fileInput.files && fileInput.files[0]) {

    const file = fileInput.files[0];

    if (!file.type.startsWith("image/")) {

      addMessage(
        "Пока NOA умеет анализировать изображения. Поддержка других файлов появится позже.",
        "noa"
      );

      fileInput.value = "";

      return;
    }

    handleAttachment(file);
  }

  fileInput.value = "";

});


/* =========================
   HANDLE ATTACHMENT
========================= */

async function handleAttachment(file) {

  if (waiting) return;

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    addMessage(
      "Пожалуйста, выбери изображение.",
      "noa"
    );

    return;
  }


  /* MAX 8 MB */

  if (file.size > 8 * 1024 * 1024) {

    addMessage(
      "Фото слишком большое. Максимальный размер — 8 МБ.",
      "noa"
    );

    return;
  }


  const imageUrl = URL.createObjectURL(file);

  const userText =
    input.value.trim();


  /* SHOW IMAGE */

  addImageMessage(
    imageUrl,
    userText
  );


  /* START REQUEST */

  waiting = true;

  sendButton.disabled = true;

  attachButton.disabled = true;

  showTyping();


  try {

    const imageData =
      await fileToDataURL(file);


    const response = await fetch(
      "/api/chat",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message:
            userText ||
            "Что изображено на этом фото? Опиши его и ответь на мой запрос по изображению.",

          image: imageData

        })

      }
    );


    let data;

    try {

      data = await response.json();

    } catch {

      throw new Error(
        "Сервер вернул неправильный ответ."
      );

    }


    hideTyping();


    if (
      !response.ok ||
      !data ||
      !data.reply
    ) {

      addMessage(
        data?.reply ||
        "NOA не смог обработать изображение. Попробуй ещё раз.",
        "noa"
      );

    } else {

      addMessage(
        String(data.reply),
        "noa"
      );

    }


  } catch (error) {

    console.error(
      "Ошибка отправки изображения:",
      error
    );

    hideTyping();

    addMessage(
      "Не удалось отправить изображение. Проверь соединение и попробуй ещё раз.",
      "noa"
    );

  } finally {

    waiting = false;

    sendButton.disabled = false;

    attachButton.disabled = false;

    input.value = "";

    input.style.height = "auto";

    URL.revokeObjectURL(imageUrl);

  }

}


/* =========================
   FILE → DATA URL
========================= */

function fileToDataURL(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {

      resolve(reader.result);

    };

    reader.onerror = () => {

      reject(
        new Error("Не удалось прочитать изображение.")
      );

    };

    reader.readAsDataURL(file);

  });

}


/* =========================
   SEND TEXT
========================= */

async function sendMessage() {

  if (waiting) return;

  const text =
    input.value.trim();

  if (!text) return;


  waiting = true;

  sendButton.disabled = true;

  attachButton.disabled = true;


  addMessage(
    text,
    "user"
  );


  input.value = "";

  input.style.height = "auto";

  showTyping();


  try {

    const response = await fetch(
      "/api/chat",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: text
        })

      }
    );


    let data;

    try {

      data = await response.json();

    } catch {

      throw new Error(
        "Неверный ответ сервера."
      );

    }


    hideTyping();


    if (
      !response.ok ||
      !data ||
      !data.reply
    ) {

      addMessage(
        data?.reply ||
        "NOA не смог сформировать ответ. Попробуй ещё раз.",
        "noa"
      );

    } else {

      addMessage(
        String(data.reply),
        "noa"
      );

    }


  } catch (error) {

    console.error(
      "Ошибка:",
      error
    );

    hideTyping();

    addMessage(
      "Не удалось подключиться к NOA. Попробуй ещё раз.",
      "noa"
    );

  } finally {

    waiting = false;

    sendButton.disabled = false;

    attachButton.disabled = false;

    input.focus();

  }

}


/* =========================
   SEND BUTTON
========================= */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* =========================
   ENTER
========================= */

input.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   SIDE MENU
========================= */

function openMenu() {

  sideMenu.classList.add("show");

  overlay.classList.add("show");

}


function closeMenu() {

  sideMenu.classList.remove("show");

  overlay.classList.remove("show");

}


menuButton.addEventListener(
  "click",
  openMenu
);


overlay.addEventListener(
  "click",
  closeMenu
);


/* =========================
   NEW CHAT
========================= */

newChatButton.addEventListener(
  "click",
  () => {

    chat.innerHTML = "";

    input.value = "";

    input.style.height = "auto";

    closeMenu();

    input.focus();

  }
);


/* =========================
   HISTORY
========================= */

historyButton.addEventListener(
  "click",
  () => {

    closeMenu();

    addMessage(
      "История запросов пока находится в разработке.",
      "noa"
    );

  }
);


/* =========================
   SETTINGS
========================= */

settingsButton.addEventListener(
  "click",
  () => {

    closeMenu();

    addMessage(
      "Настройки NOA пока находятся в разработке.",
      "noa"
    );

  }
);


/* =========================
   INITIAL FOCUS
========================= */

setTimeout(() => {

  input.focus();

}, 1200);

</script>

</body>
</html>
