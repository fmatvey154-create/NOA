<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOA</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  display: flex;
  justify-content: center;
}

.app {
  position: relative;
  width: 100%;
  max-width: 900px;
  height: 100%;
  background: #000;
  overflow: hidden;
}


/* =========================
   ГЛАВНЫЙ ЭКРАН
   ========================= */

.logo-screen {
  position: absolute;
  inset: 0;
  z-index: 10;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  transition:
    transform .9s cubic-bezier(.22,.61,.36,1),
    opacity .7s ease;

  pointer-events: none;
}

.logo {
  margin: 0;
  padding: 0;

  border: none;
  outline: none;
  box-shadow: none;

  background: transparent;

  font-size: clamp(64px, 20vw, 150px);
  line-height: 1;

  font-weight: 800;
  letter-spacing: -.07em;

  background-image: linear-gradient(
    180deg,
    #ffffff 0%,
    #d7d7d7 35%,
    #858585 65%,
    #eeeeee 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;

  filter:
    drop-shadow(0 0 12px rgba(255,255,255,.08))
    drop-shadow(0 0 35px rgba(255,0,0,.12));

  animation: logoAppear 1.2s ease;
}

@keyframes logoAppear {
  from {
    opacity: 0;
    transform: scale(.94);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.app.started .logo-screen {
  transform: translateY(-100%);
  opacity: 0;
}


/* Красное свечение */

.red-glow {
  position: absolute;

  width: 320px;
  height: 320px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  background: radial-gradient(
    circle,
    rgba(255,0,0,.10) 0%,
    rgba(255,0,0,.035) 35%,
    transparent 70%
  );

  pointer-events: none;
}


/* =========================
   ЧАТ
   ========================= */

.chat {
  position: absolute;
  inset: 0;

  display: flex;
  flex-direction: column;

  opacity: 1;
}


/* Верхняя панель */

.topbar {
  height: 64px;
  flex-shrink: 0;

  display: flex;
  align-items: center;

  padding: 0 16px;

  border-bottom: 1px solid rgba(255,255,255,.06);

  background: rgba(0,0,0,.82);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}


/* Кнопка меню */

.menu-button {
  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;
  outline: none;

  border-radius: 12px;

  background: transparent;
  color: white;

  font-size: 27px;

  cursor: pointer;

  transition:
    background .2s ease,
    transform .15s ease;
}

.menu-button:active {
  transform: scale(.9);
}

.menu-button:hover {
  background: rgba(255,255,255,.07);
}


/* Логотип вверху */

.topbar-logo {
  position: absolute;

  left: 50%;

  transform: translateX(-50%);

  font-size: 22px;
  font-weight: 800;

  letter-spacing: -.04em;

  background: linear-gradient(
    180deg,
    #ffffff,
    #999999
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}


/* =========================
   СООБЩЕНИЯ
   ========================= */

.messages {
  flex: 1;

  overflow-y: auto;

  padding: 25px 16px 125px;

  scroll-behavior: smooth;
}

.messages::-webkit-scrollbar {
  width: 4px;
}

.messages::-webkit-scrollbar-thumb {
  background: #222;
  border-radius: 10px;
}

.message {
  width: fit-content;
  max-width: min(82%, 650px);

  margin-bottom: 14px;

  padding: 12px 15px;

  border-radius: 18px;

  font-size: 16px;
  line-height: 1.45;

  animation: messageIn .25s ease;

  white-space: pre-wrap;
  word-wrap: break-word;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user {
  margin-left: auto;

  background: #181818;

  border: 1px solid rgba(255,255,255,.06);

  border-bottom-right-radius: 6px;
}

.message.noa {
  margin-right: auto;

  background: transparent;

  color: #e7e7e7;

  border-bottom-left-radius: 6px;
}

.message.error {
  color: #ff5555;
}


/* =========================
   ПОЛЕ ВВОДА
   ========================= */

.input-area {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  padding:
    12px
    12px
    calc(12px + env(safe-area-inset-bottom));

  background: linear-gradient(
    to top,
    #000 55%,
    transparent
  );
}

.input-box {
  display: flex;
  align-items: flex-end;

  gap: 8px;

  padding: 8px;

  border: 1px solid rgba(255,255,255,.09);

  border-radius: 24px;

  background: #101010;

  box-shadow:
    0 0 25px rgba(255,0,0,.035),
    inset 0 0 15px rgba(255,255,255,.015);
}

textarea {
  flex: 1;

  min-height: 42px;
  max-height: 130px;

  padding: 10px 8px;

  resize: none;

  border: none;
  outline: none;

  background: transparent;

  color: white;

  font-family: inherit;
  font-size: 16px;
  line-height: 1.4;
}

textarea::placeholder {
  color: #777;
}


/* Кнопка отправки */

.send {
  width: 42px;
  height: 42px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;
  outline: none;

  border-radius: 50%;

  background: white;
  color: black;

  font-size: 19px;
  font-weight: 700;

  cursor: pointer;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

.send:active {
  transform: scale(.9);
}

.send:disabled {
  opacity: .35;
}


/* =========================
   ПЕЧАТЬ NOA
   ========================= */

.typing {
  display: flex;

  gap: 5px;

  padding: 10px 4px;
}

.typing span {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #777;

  animation: typing 1.2s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes typing {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: .35;
  }

  30% {
    transform: translateY(-4px);
    opacity: 1;
  }
}


/* =========================
   МЕНЮ
   ========================= */

.side-menu {
  position: absolute;

  top: 0;
  left: 0;

  z-index: 30;

  width: 280px;
  height: 100%;

  background: #090909;

  border-right: 1px solid rgba(255,255,255,.08);

  transform: translateX(-100%);

  transition: transform .3s ease;

  box-shadow: 10px 0 40px rgba(0,0,0,.5);
}

.side-menu.open {
  transform: translateX(0);
}

.menu-title {
  height: 64px;

  display: flex;
  align-items: center;

  padding: 0 20px;

  font-size: 22px;
  font-weight: 800;

  color: #ddd;

  border-bottom: 1px solid rgba(255,255,255,.06);
}

.menu-item {
  padding: 18px 20px;

  color: #bbb;

  font-size: 16px;

  border-bottom: 1px solid rgba(255,255,255,.04);
}


/* Затемнение */

.overlay {
  position: absolute;

  inset: 0;

  z-index: 20;

  background: rgba(0,0,0,.55);

  opacity: 0;
  pointer-events: none;

  transition: opacity .3s ease;
}

.overlay.open {
  opacity: 1;
  pointer-events: auto;
}

</style>
</head>


<body>

<div class="app" id="app">


  <!-- ГЛАВНЫЙ ЭКРАН -->

  <div class="logo-screen">

    <div class="red-glow"></div>

    <div class="logo">
      NOA
    </div>

  </div>


  <!-- ЧАТ -->

  <div class="chat">


    <!-- ВЕРХ -->

    <div class="topbar">

      <button
        class="menu-button"
        id="menuButton"
        type="button"
      >
        ☰
      </button>

      <div class="topbar-logo">
        NOA
      </div>

    </div>


    <!-- СООБЩЕНИЯ -->

    <div
      class="messages"
      id="messages"
    ></div>


    <!-- ВВОД -->

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="input"
          rows="1"
          placeholder="Напишите сообщение..."
        ></textarea>

        <button
          class="send"
          id="send"
          type="button"
        >
          ↑
        </button>

      </div>

    </div>

  </div>


  <!-- МЕНЮ -->

  <div
    class="overlay"
    id="overlay"
  ></div>


  <div
    class="side-menu"
    id="sideMenu"
  >

    <div class="menu-title">
      NOA
    </div>

    <div class="menu-item">
      Новый чат
    </div>

    <div class="menu-item">
      История
    </div>

    <div class="menu-item">
      Настройки
    </div>

  </div>

</div>


<script>

const app =
  document.getElementById("app");

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const menuButton =
  document.getElementById("menuButton");

const sideMenu =
  document.getElementById("sideMenu");

const overlay =
  document.getElementById("overlay");


let started = false;
let waiting = false;


/* =========================
   СТАРТ NOA
   ========================= */

function startNOA() {

  if (!started) {

    started = true;

    app.classList.add("started");

  }

}


/* =========================
   ДОБАВЛЕНИЕ СООБЩЕНИЯ
   ========================= */

function addMessage(text, type) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent =
    text;

  messages.appendChild(message);

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================
   ПЕЧАТЬ
   ========================= */

function addTyping() {

  const message =
    document.createElement("div");

  message.className =
    "message noa";

  message.id =
    "typing";

  message.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  messages.appendChild(message);

  messages.scrollTop =
    messages.scrollHeight;

}


function removeTyping() {

  const typing =
    document.getElementById("typing");

  if (typing) {

    typing.remove();

  }

}


/* =========================
   ОТПРАВКА
   ========================= */

async function sendMessage() {

  const text =
    input.value.trim();


  if (!text || waiting) {

    return;

  }


  startNOA();


  addMessage(
    text,
    "user"
  );


  input.value = "";

  input.style.height =
    "42px";


  waiting = true;

  send.disabled = true;


  addTyping();


  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: text
          })
        }
      );


    removeTyping();


    if (!response.ok) {

      throw new Error(
        "Server error"
      );

    }


    const data =
      await response.json();


    const answer =
      data.reply ||
      data.response ||
      data.message ||
      data.text;


    if (!answer) {

      throw new Error(
        "Empty response"
      );

    }


    addMessage(
      answer,
      "noa"
    );


  } catch (error) {

    removeTyping();


    addMessage(
      "NOA не смог сформировать ответ.",
      "noa error"
    );


    console.error(error);

  }


  waiting = false;

  send.disabled = false;

  input.focus();

}


/* =========================
   КНОПКИ
   ========================= */

send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* Автоматический размер поля */

input.addEventListener(
  "input",
  function() {

    this.style.height =
      "42px";

    this.style.height =
      Math.min(
        this.scrollHeight,
        130
      ) + "px";

  }
);


/* =========================
   МЕНЮ
   ========================= */

function openMenu() {

  sideMenu.classList.add(
    "open"
  );

  overlay.classList.add(
    "open"
  );

}


function closeMenu() {

  sideMenu.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "open"
  );

}


menuButton.addEventListener(
  "click",
  openMenu
);


overlay.addEventListener(
  "click",
  closeMenu
);

</script>

</body>
</html>
