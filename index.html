<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 0, 0, 0.12), transparent 35%),
        #050505;
    }

    /* HEADER */

    .header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(5,5,5,0.85);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050505;
      border: 1px solid rgba(255,0,0,0.55);

      color: white;
      font-weight: 800;
      font-size: 14px;

      box-shadow:
        0 0 12px rgba(255,0,0,0.35),
        inset 0 0 12px rgba(255,0,0,0.12);
    }

    .title {
      margin-left: 12px;
    }

    .title h1 {
      font-size: 18px;
      letter-spacing: 1px;
    }

    .status {
      margin-top: 3px;
      font-size: 12px;
      color: #777;
    }

    .status span {
      color: #ff3030;
    }

    /* CHAT */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 18px 110px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #242424;
      border-bottom-right-radius: 5px;
    }

    .message.ai {
      align-self: flex-start;
      background: #111;
      border: 1px solid rgba(255,0,0,0.18);
      border-bottom-left-radius: 5px;
      box-shadow: 0 0 15px rgba(255,0,0,0.05);
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 500px;
      padding: 20px;
    }

    .welcome-logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 25px;

      background: #050505;
      border: 1px solid rgba(255,0,0,0.6);

      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;

      box-shadow:
        0 0 25px rgba(255,0,0,0.25),
        inset 0 0 20px rgba(255,0,0,0.1);
    }

    .welcome h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #777;
      font-size: 14px;
    }

    /* INPUT */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      padding: 14px 16px 18px;

      background: linear-gradient(
        to top,
        #050505 65%,
        transparent
      );
    }

    .input-box {
      max-width: 850px;
      margin: auto;

      display: flex;
      align-items: center;

      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;

      padding: 6px;

      transition: 0.2s;
    }

    .input-box:focus-within {
      border-color: rgba(255,0,0,0.55);
      box-shadow: 0 0 20px rgba(255,0,0,0.08);
    }

    #input {
      flex: 1;
      border: none;
      outline: none;

      background: transparent;
      color: white;

      font-size: 15px;
      padding: 12px;
    }

    #input::placeholder {
      color: #666;
    }

    #send {
      width: 43px;
      height: 43px;

      border: none;
      border-radius: 14px;

      background: #e00000;
      color: white;

      cursor: pointer;

      font-size: 18px;
      font-weight: bold;

      transition: 0.2s;
    }

    #send:hover {
      background: #ff1717;
      box-shadow: 0 0 18px rgba(255,0,0,0.4);
    }

    #send:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .header {
        height: 62px;
        padding: 0 14px;
      }

      .messages {
        padding: 18px 12px 105px;
      }

      .message {
        max-width: 88%;
        font-size: 14px;
      }

      .welcome h2 {
        font-size: 24px;
      }

      .welcome-logo {
        width: 70px;
        height: 70px;
        font-size: 21px;
      }

      .input-area {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">NOA</div>

    <div class="title">
      <h1>NOA AI</h1>
      <div class="status">
        <span>●</span> AI Assistant
      </div>
    </div>
  </header>


  <main class="messages" id="messages">

    <div class="welcome" id="welcome">

      <div class="welcome-logo">
        NOA
      </div>

      <h2>Привет 👋</h2>

      <p>
        Я NOA — твой персональный AI-ассистент.
        Напиши мне что-нибудь.
      </p>

    </div>

  </main>


  <div class="input-area">

    <div class="input-box">

      <input
        id="input"
        type="text"
        placeholder="Напишите сообщение..."
        autocomplete="off"
      >

      <button id="send" type="button">
        ↑
      </button>

    </div>

  </div>

</div>


<script>

  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");


  function addMessage(text, type) {

    if (welcome) {
      welcome.remove();
    }

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;

    return message;
  }


  async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    send.disabled = true;

    const thinking = addMessage("NOA думает...", "ai");

    try {

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: text
        })

      });


      const data = await response.json();

      thinking.remove();


      if (!response.ok) {

        addMessage(
          "Ошибка: " + (data.error || "неизвестная ошибка"),
          "ai"
        );

        return;
      }


      addMessage(
        data.reply || "NOA не получил ответ.",
        "ai"
      );


    } catch (error) {

      thinking.remove();

      addMessage(
        "Не удалось подключиться к NOA.",
        "ai"
      );

    } finally {

      send.disabled = false;

      input.focus();

    }

  }


  send.addEventListener("click", sendMessage);


  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  });

</script>

</body>
</html>
