<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>НОА — AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#090909;
    --sidebar:#0d0d0d;
    --panel:#111111;
    --border:#222;
    --text:#f5f5f5;
    --muted:#858585;
    --red:#ff2424;
    --red-dark:#8f0808;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* Красное свечение */

body::before{
    content:"";
    position:fixed;
    width:650px;
    height:650px;
    top:-350px;
    left:40%;
    background:#ff0000;
    filter:blur(180px);
    opacity:.07;
    pointer-events:none;
}

/* APP */

.app{
    height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:270px;
    height:100vh;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:18px 14px;
}

.logo{
    padding:8px 12px 24px;
    font-size:24px;
    font-weight:800;
    letter-spacing:-1px;

    background:linear-gradient(
        120deg,
        #fff,
        #ff3b3b,
        #a00000
    );

    -webkit-background-clip:text;
    color:transparent;
}

/* NEW CHAT */

.new-chat{
    width:100%;
    padding:12px 15px;

    background:#151515;
    border:1px solid #292929;
    border-radius:10px;

    color:#eee;
    text-align:left;
    font-size:14px;

    cursor:pointer;
    transition:.2s;
}

.new-chat:hover{
    background:#1b0b0b;
    border-color:#651515;
    box-shadow:0 0 18px rgba(255,0,0,.12);
}

/* CHAT LIST */

.chat-list{
    margin-top:20px;
    overflow:auto;
}

.chat-label{
    font-size:11px;
    color:#555;
    padding:10px 12px;
    text-transform:uppercase;
}

.chat-item{
    padding:10px 12px;
    margin-bottom:3px;

    border-radius:8px;

    color:#aaa;
    font-size:13px;

    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-item:hover{
    background:#181818;
    color:#eee;
}

.sidebar-bottom{
    margin-top:auto;
    padding:12px;
    color:#555;
    font-size:12px;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

/* TOPBAR */

.topbar{
    height:60px;

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;

    padding:0 24px;

    background:rgba(9,9,9,.85);
    backdrop-filter:blur(15px);
}

.model-name{
    font-size:14px;
    font-weight:600;
}

.model-status{
    margin-left:10px;
    font-size:11px;
    color:#666;
}

.status{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:7px;

    color:#666;
    font-size:11px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--red);

    box-shadow:
        0 0 8px #ff0000;
}

/* CHAT */

.chat{
    flex:1;

    overflow-y:auto;

    padding:30px 20px 150px;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#292929;
    border-radius:10px;
}

/* WELCOME */

.welcome{
    max-width:760px;

    margin:18vh auto 0;

    text-align:center;
}

.welcome-logo{
    font-size:68px;
    font-weight:900;

    letter-spacing:-5px;

    background:linear-gradient(
        135deg,
        #ffffff,
        #ff3535,
        #760000
    );

    -webkit-background-clip:text;
    color:transparent;

    text-shadow:
        0 0 40px rgba(255,0,0,.15);
}

.welcome h1{
    margin-top:12px;

    font-size:24px;
    font-weight:500;
}

.welcome p{
    margin-top:8px;

    color:#666;
    font-size:14px;
}

/* MESSAGE */

.message{
    max-width:800px;

    margin:0 auto 30px;

    display:flex;
    gap:14px;

    animation:messageIn .25s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.avatar{
    width:32px;
    height:32px;

    min-width:32px;

    border-radius:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:12px;
    font-weight:bold;

    background:linear-gradient(
        135deg,
        #ff2424,
        #720000
    );

    box-shadow:
        0 0 15px rgba(255,0,0,.2);
}

.user-avatar{
    background:#242424;
    box-shadow:none;
}

.message-content{
    padding-top:5px;

    max-width:720px;

    line-height:1.6;

    font-size:14px;

    color:#e5e5e5;
}

/* INPUT AREA */

.input-area{
    position:absolute;

    bottom:0;
    left:270px;
    right:0;

    padding:25px 20px 25px;

    background:linear-gradient(
        transparent,
        #090909 35%
    );
}

/* INPUT */

.input-box{
    max-width:800px;

    margin:auto;

    display:flex;
    align-items:flex-end;

    background:#151515;

    border:1px solid #292929;

    border-radius:16px;

    padding:7px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.5);

    transition:.2s;
}

.input-box:focus-within{
    border-color:#5c1b1b;

    box-shadow:
        0 0 30px rgba(255,0,0,.09);
}

.input-box textarea{
    flex:1;

    resize:none;

    max-height:150px;

    min-height:42px;

    background:transparent;

    border:none;
    outline:none;

    color:#fff;

    padding:11px 12px;

    font-family:inherit;
    font-size:14px;
}

.input-box textarea::placeholder{
    color:#555;
}

.send{
    width:40px;
    height:40px;

    border:none;

    border-radius:11px;

    background:#b00000;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.2s;

    box-shadow:
        0 0 15px rgba(255,0,0,.18);
}

.send:hover{
    background:#e00000;

    box-shadow:
        0 0 25px rgba(255,0,0,.35);
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .topbar{
        padding:0 16px;
    }

    .chat{
        padding-left:12px;
        padding-right:12px;
    }

    .welcome{
        margin-top:20vh;
    }

    .welcome-logo{
        font-size:55px;
    }

    .input-area{
        left:0;
        padding:12px;
    }

}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        НОА
    </div>

    <button
        class="new-chat"
        onclick="newChat()"
    >
        ＋ Новый чат
    </button>

    <div class="chat-list">

        <div class="chat-label">
            Сегодня
        </div>

        <div class="chat-item">
            Новый разговор
        </div>

    </div>

    <div class="sidebar-bottom">
        НОА AI
    </div>

</aside>


<!-- MAIN -->

<main class="main">

<header class="topbar">

    <div class="model-name">
        НОА
    </div>

    <div class="model-status">
        AI
    </div>

    <div class="status">

        <div class="status-dot"></div>

        Онлайн

    </div>

</header>


<!-- CHAT -->

<section
    class="chat"
    id="chat"
>

    <div
        class="welcome"
        id="welcome"
    >

        <div class="welcome-logo">
            Н
