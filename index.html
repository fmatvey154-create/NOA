<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NOA</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
textarea {
  font: inherit;
}

.app {
  position: relative;
  width: 100%;
  max-width: 900px;
  height: 100%;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  background: #000;
}

/* =========================================================
   ЛОГОТИП
========================================================= */

.logo-screen {
  position: absolute;
  inset: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;

  pointer-events: none;

  transition:
    transform .85s cubic-bezier(.22,.61,.36,1),
    opacity .65s ease;
}

.logo {
  margin: 0;
  padding: 0;

  font-size: clamp(114px, 30vw, 225px);
  font-weight: 800;
  letter-spacing: -.075em;
  line-height: 1;

  background: linear-gradient(
    180deg,
    #fff 0%,
    #dedede 35%,
    #898989 68%,
    #f4f4f4 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;

  animation: logoAppear 1s ease both;
}

@keyframes logoAppear {
  from {
    opacity: 0;
    transform: scale(.95);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.app.started .logo-screen {
  transform: translateY(-100%);
  opacity: 0;
}

/* =========================================================
   ЧАТ
========================================================= */

.chat {
  position: absolute;
  inset: 0;
  z-index: 15;

  display: flex;
  flex-direction: column;

  min-height: 0;

  background: #000;
}

/* =========================================================
   ВЕРХНЯЯ ПАНЕЛЬ
========================================================= */

.topbar {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: center;

  flex-shrink: 0;

  height: 62px;
  padding: 0 14px;

  background: rgba(0,0,0,.45);

  border-bottom: 1px solid rgba(255,255,255,.055);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.menu-button {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 44px;
  height: 44px;
  padding: 0;

  color: #eee;
  background: transparent;

  border: none;
  border-radius: 12px;

  font-size: 27px;
  cursor: pointer;
}

.menu-button:active {
  background: #191919;
  transform: scale(.94);
}

.topbar-logo {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.04em;

  background: linear-gradient(
    180deg,
    #fff,
    #999
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* =========================================================
   СООБЩЕНИЯ
========================================================= */

.messages {
  flex: 1;
  min-height: 0;

  overflow-y: auto;
  overscroll-behavior: contain;

  padding: 22px 15px 20px;

  scrollbar-width: thin;
  scrollbar-color: #292929 transparent;
}

.message {
  width: fit-content;
  max-width: min(85%, 650px);

  margin: 0 0 14px;
  padding: 12px 15px;

  border-radius: 18px;

  font-size: 16px;
  line-height: 1.5;

  white-space: pre-wrap;
  overflow-wrap: anywhere;

  animation: messageIn .2s ease;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user {
  margin-left: auto;

  color: #fff;
  background: #191919;

  border: 1px solid rgba(255,255,255,.07);
  border-bottom-right-radius: 6px;
}

.message.noa {
  margin-right: auto;
  padding-left: 2px;

  color: #e8e8e8;
  background: transparent;
}

.message.error {
  color: #ff7777;
}

/* =========================================================
   ИЗОБРАЖЕНИЯ В ЧАТЕ
========================================================= */

.message-image {
  display: block;

  max-width: 260px;
  max-height: 340px;

  margin: 0;

  border-radius: 15px;

  object-fit: cover;
}

/* =========================================================
   ПОЛЕ ВВОДА
========================================================= */

.input-area {
  position: relative;
  z-index: 2;

  flex-shrink: 0;

  padding:
    12px
    12px
    calc(12px + env(safe-area-inset-bottom));

  background: linear-gradient(
    to top,
    #000 70%,
    rgba(0,0,0,.88)
  );
}

/* =========================================================
   ПРЕВЬЮ ВЛОЖЕНИЯ
========================================================= */

.pending-attachment {
  display: none;

  width: 100%;
  padding: 0 8px 8px;
}

.pending-attachment.open {
  display: block;
}

.pending-image-card {
  position: relative;

  display: inline-block;

  width: 76px;
  height: 76px;
}

.pending-image {
  display: block;

  width: 76px;
  height: 76px;

  object-fit: cover;

  border-radius: 15px;
  border: 1px solid rgba(255,255,255,.12);

  background: #151515;
}

.remove-pending-image {
  position: absolute;

  top: -8px;
  right: -8px;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 25px;
  height: 25px;
  padding: 0;

  color: #fff;
  background: #292929;

  border: 1px solid #444;
  border-radius: 50%;

  font-size: 17px;
  line-height: 1;

  cursor: pointer;

  box-shadow: 0 3px 12px rgba(0,0,0,.5);
}

.remove-pending-image:active {
  transform: scale(.9);
}

/* =========================================================
   INPUT BOX
========================================================= */

.input-box {
  position: relative;

  display: flex;
  align-items: flex-end;
  gap: 8px;

  width: 100%;
  padding: 7px 8px;

  background: #111;

  border: 1px solid #292929;
  border-radius: 25px;

  box-shadow:
    0 0 22px rgba(255,255,255,.025);
}

/* =========================================================
   ВЛОЖЕНИЯ
========================================================= */

.attachment-wrapper {
  position: relative;

  flex-shrink: 0;
  align-self: flex-end;
}

.attachment-button {
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 42px;
  height: 42px;
  padding: 0;

  color: #ddd;
  background: transparent;

  border: none;
  border-radius: 50%;

  overflow: hidden;

  cursor: pointer;
}

.attachment-button:active {
  background: #202020;
  transform: scale(.93);
}

.attachment-button:disabled {
  opacity: .4;
}

.attachment-icon {
  position: absolute;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 32px;
  height: 32px;

  font-size: 21px;
  line-height: 1;

  opacity: 0;

  pointer-events: none;
}

.attachment-icon.photo {
  animation: attachmentPhoto 6.4s infinite;
}

.attachment-icon.file {
  animation: attachmentFile 6.4s infinite;
  animation-delay: 3.2s;
}

@keyframes attachmentPhoto {
  0% {
    opacity: 0;
    transform: translateY(-13px) rotate(0);
  }

  9.375% {
    opacity: 1;
    transform: translateY(0) rotate(0);
  }

  40.625% {
    opacity: 1;
    transform: translateY(0) rotate(0);
  }

  50% {
    opacity: 0;
    transform: translateY(17px) rotate(-18deg);
  }

  100% {
    opacity: 0;
    transform: translateY(17px) rotate(-18deg);
  }
}

@keyframes attachmentFile {
  0% {
    opacity: 0;
    transform: translateY(-13px) rotate(0);
  }

  9.375% {
    opacity: 1;
    transform: translateY(0) rotate(0);
  }

  40.625% {
    opacity: 1;
    transform: translateY(0) rotate(0);
  }

  50% {
    opacity: 0;
    transform: translateY(17px) rotate(-18deg);
  }

  100% {
    opacity: 0;
    transform: translateY(17px) rotate(-18deg);
  }
}

/* =========================================================
   МЕНЮ ВЛОЖЕНИЙ
========================================================= */

.attachment-menu {
  position: absolute;

  left: 0;
  bottom: 52px;

  width: 185px;

  padding: 7px;

  background: rgba(22,22,22,.98);

  border: 1px solid #303030;
  border-radius: 17px;

  box-shadow:
    0 14px 40px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.02);

  opacity: 0;
  visibility: hidden;

  transform: translateY(8px) scale(.96);
  transform-origin: bottom left;

  transition:
    opacity .2s ease,
    transform .2s ease,
    visibility .2s ease;

  z-index: 50;
}

.attachment-menu.open {
  opacity: 1;
  visibility: visible;

  transform:
    translateY(0)
    scale(1);
}

.attachment-option {
  display: flex;
  align-items: center;
  gap: 12px;

  width: 100%;
  min-height: 46px;

  padding: 9px 11px;

  color: #eee;
  background: transparent;

  border: none;
  border-radius: 11px;

  text-align: left;
  font-size: 15px;

  cursor: pointer;
}

.attachment-option:active {
  background: #292929;
}

.attachment-option-icon {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 27px;
  height: 27px;

  font-size: 20px;
}

.hidden-file-input {
  display: none;
}

/* =========================================================
   TEXTAREA
========================================================= */

textarea {
  display: block;

  flex: 1;
  min-width: 0;

  min-height: 42px;
  max-height: 130px;

  padding: 11px 0;

  resize: none;
  overflow-y: auto;

  color: #fff;
  caret-color: #fff;

  background: transparent;

  border: none;
  outline: none;

  font-size: 16px;
  line-height: 20px;
}

textarea::placeholder {
  color: #858585;
}

/* =========================================================
   SEND
========================================================= */

.send {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 42px;
  height: 42px;

  flex-shrink: 0;

  color: #000;
  background: #f5f5f5;

  border: none;
  border-radius: 50%;

  font-size: 25px;
  line-height: 1;

  cursor: pointer;
}

.send:active {
  transform: scale(.93);
}

.send:disabled {
  opacity: .4;
}

/* =========================================================
   ПЕЧАТЬ NOA
========================================================= */

.typing {
  display: flex;
  align-items: center;
  gap: 5px;

  padding: 12px 4px;
}

.typing span {
  width: 6px;
  height: 6px;

  border-radius: 50%;
  background: #888;

  animation:
    pulse 1.1s
    infinite
    ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes pulse {
  0%,
  60%,
  100% {
    opacity: .35;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-4px);
  }
}

/* =========================================================
   БОКОВОЕ МЕНЮ
========================================================= */

.overlay {
  position: absolute;
  inset: 0;

  z-index: 25;

  background: rgba(0,0,0,.65);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity .25s,
    visibility .25s;
}

.overlay.open {
  opacity: 1;
  visibility: visible;
}

.side-menu {
  position: absolute;

  top: 0;
  bottom: 0;
  left: 0;

  z-index: 30;

  width: min(310px, 82vw);

  padding-top:
    env(safe-area-inset-top);

  background: #0a0a0a;

  border-right: 1px solid #242424;

  transform: translateX(-101%);

  transition:
    transform .28s ease;

  overflow-y: auto;
}

.side-menu.open {
  transform: translateX(0);
}

.menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  height: 62px;
  padding: 0 18px;

  border-bottom: 1px solid #222;
}

.menu-brand {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.04em;

  background:
    linear-gradient(
      #fff,
      #999
    );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.close-menu {
  width: 38px;
  height: 38px;

  color: #ddd;
  background: transparent;

  border: none;
  border-radius: 10px;

  font-size: 25px;

  cursor: pointer;
}

.close-menu:active {
  background: #191919;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;

  width: 100%;

  min-height: 54px;

  padding: 15px 20px;

  color: #ccc;
  background: transparent;

  border: none;
  border-bottom: 1px solid rgba(255,255,255,.045);

  text-align: left;
  font-size: 15px;

  cursor: pointer;
}

.menu-item:active {
  background: #181818;
}

.menu-item-icon {
  width: 24px;

  color: #aaa;

  text-align: center;
  font-size: 18px;
}

.menu-note {
  padding: 18px 20px;

  color: #555;

  font-size: 12px;
}

/* =========================================================
   ВНУТРЕННИЕ ПАНЕЛИ
========================================================= */

.panel-overlay {
  position: absolute;
  inset: 0;

  z-index: 70;

  display: flex;
  align-items: flex-end;

  background: rgba(0,0,0,.7);

  opacity: 0;
  visibility: hidden;

  pointer-events: none;

  transition:
    opacity .25s ease,
    visibility .25s ease;
}

.panel-overlay.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.panel {
  width: 100%;
  max-height: 82%;

  overflow-y: auto;

  padding:
    20px
    18px
    calc(20px + env(safe-area-inset-bottom));

  background: #101010;

  border-top:
    1px solid
    rgba(255,255,255,.1);

  border-radius:
    24px
    24px
    0
    0;

  transform: translateY(100%);

  transition:
    transform .3s
    cubic-bezier(.22,.61,.36,1);
}

.panel-overlay.open .panel {
  transform: translateY(0);
}

.panel-title {
  margin: 0 0 17px;

  color: #fff;

  font-size: 21px;
  font-weight: 700;
}

.panel-close {
  position: absolute;

  top: 12px;
  right: 14px;

  width: 38px;
  height: 38px;

  color: #ccc;
  background: #202020;

  border: none;
  border-radius: 50%;

  font-size: 22px;
}

.panel-card {
  margin-bottom: 10px;
  padding: 15px;

  background: #181818;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-radius: 16px;
}

.panel-card-title {
  margin-bottom: 5px;

  color: #fff;

  font-size: 16px;
  font-weight: 600;
}

.panel-card-text {
  color: #888;

  font-size: 13px;
  line-height: 1.45;
}

.panel-button {
  width: 100%;

  margin-top: 10px;
  padding: 13px;

  color: #fff;
  background: #242424;

  border: 1px solid #333;
  border-radius: 13px;

  font-size: 14px;

  cursor: pointer;
}

.panel-button:active {
  transform: scale(.98);
  background: #2d2d2d;
}

/* =========================================================
   ИСТОРИЯ
========================================================= */

.history-empty {
  padding: 25px 10px;

  color: #666;

  text-align: center;
  font-size: 14px;
}

.history-item {
  width: 100%;

  margin-bottom: 8px;
  padding: 13px;

  color: #ddd;
  background: #181818;

  border:
    1px solid
    rgba(255,255,255,.05);

  border-radius: 14px;

  text-align: left;
}

.history-item-title {
  margin-bottom: 5px;

  color: #eee;

  font-size: 14px;
}

.history-item-date {
  color: #666;

  font-size: 11px;
}

/* =========================================================
   ТАРИФЫ
========================================================= */

.price {
  margin-top: 6px;

  color: #fff;

  font-size: 20px;
  font-weight: 700;
}

/* =========================================================
   НАСТРОЙКИ
========================================================= */

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;

  padding: 14px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);
}

.setting-row:last-child {
  border-bottom: none;
}

.setting-name {
  color: #ddd;
  font-size: 14px;
}

.setting-description {
  margin-top: 3px;

  color: #666;

  font-size: 11px;
}

/* =========================================================
   SWITCH
========================================================= */

.switch {
  position: relative;

  width: 48px;
  height: 28px;

  flex-shrink: 0;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  inset: 0;

  background: #303030;

  border-radius: 30px;

  transition: .2s;
}

.slider::before {
  content: "";

  position: absolute;

  width: 22px;
  height: 22px;

  left: 3px;
  top: 3px;

  background: #fff;

  border-radius: 50%;

  transition: .2s;
}

.switch input:checked + .slider {
  background: #fff;
}

.switch input:checked + .slider::before {
  transform: translateX(20px);
  background: #000;
}

/* =========================================================
   МУЗЫКАЛЬНЫЙ ПЛЕЕР
========================================================= */

.music-player {
  position: relative;

  display: none;

  flex-shrink: 0;

  margin: 8px 12px 0;

  min-height: 104px;

  overflow: hidden;

  background: #080808;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius: 20px;

  box-shadow:
    0 10px 35px rgba(0,0,0,.4);
}

.music-player.open {
  display: block;
}

.music-liquid {
  position: absolute;
  inset: -40%;

  opacity: .75;

  background:
    radial-gradient(
      circle at 20% 30%,
      rgba(255,70,150,.75),
      transparent 25%
    ),
    radial-gradient(
      circle at 70% 25%,
      rgba(80,120,255,.7),
      transparent 27%
    ),
    radial-gradient(
      circle at 75% 75%,
      rgba(90,255,220,.65),
      transparent 28%
    ),
    radial-gradient(
      circle at 30% 80%,
      rgba(255,190,50,.65),
      transparent 27%
    );

  filter: blur(28px);

  animation:
    liquidMove
    10s
    ease-in-out
    infinite
    alternate;
}

.music-player.paused .music-liquid {
  animation-play-state: paused;
}

@keyframes liquidMove {
  0% {
    transform:
      translate(-4%, -3%)
      rotate(0deg)
      scale(1);
    border-radius: 45% 55% 60% 40%;
  }

  50% {
    transform:
      translate(4%, 3%)
      rotate(8deg)
      scale(1.08);
    border-radius: 60% 40% 45% 55%;
  }

  100% {
    transform:
      translate(-2%, 5%)
      rotate(-7deg)
      scale(1.13);
    border-radius: 40% 60% 55% 45%;
  }
}

.music-content {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: center;
  gap: 13px;

  min-height: 104px;

  padding: 13px;
}

.music-cover {
  width: 72px;
  height: 72px;

  flex-shrink: 0;

  object-fit: cover;

  background: #1b1b1b;

  border-radius: 14px;

  border:
    1px solid
    rgba(255,255,255,.12);
}

.music-info {
  min-width: 0;
  flex: 1;
}

.music-title {
  overflow: hidden;

  color: #eee;

  font-size: 15px;
  font-weight: 700;

  text-overflow: ellipsis;
  white-space: nowrap;
}

.music-status {
  margin-top: 4px;

  color: #999;

  font-size: 12px;
}

.music-controls {
  display: flex;
  align-items: center;

  gap: 5px;

  margin-top: 9px;
}

.music-control {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 31px;
  height: 31px;

  padding: 0;

  color: #eee;
  background: rgba(0,0,0,.35);

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius: 50%;

  cursor: pointer;
}

.music-control.play {
  color: #000;
  background: #fff;
}

.music-control:active {
  transform: scale(.9);
}

.music-close {
  position: absolute;

  top: 8px;
  right: 8px;

  z-index: 4;

  width: 28px;
  height: 28px;

  color: #ccc;
  background: rgba(0,0,0,.35);

  border: none;
  border-radius: 50%;
}

/* =========================================================
   АДАПТАЦИЯ
========================================================= */

@media (max-width: 500px) {

  .message {
    max-width: 90%;
  }

  .music-player {
    margin-left: 9px;
    margin-right: 9px;
  }

}

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }

}
</style>
</head>

<body>

<div class="app" id="app">

  <div class="logo-screen" id="logoScreen">
    <div class="logo">NOA</div>
  </div>

  <main class="chat">

    <header class="topbar">

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Открыть меню"
      >☰</button>

      <div class="topbar-logo">NOA</div>

<script>
/* =========================================================
   NOA — ОСНОВНОЙ JAVASCRIPT

/* =========================================================

let started = false;

let pendingImageFile = null;
let pendingImageData = null;
let pendingImageUrl = null;


/* =========================================================

function startNOA() {

/* =========================================================
   СООБЩЕНИЯ
========================================================= */

function addMessage(text, type) {

  const el =
    document.createElement("div");

  el.className =
    "message " + type;

  el.textContent =
    text;

  messages.appendChild(el);

  messages.scrollTop =
    messages.scrollHeight;

  return el;
}


/* =========================================================
   ИЗОБРАЖЕНИЕ В ЧАТЕ
========================================================= */

function addImageMessage(
  imageUrl,
  text
) {

  const el =
    document.createElement("div");

  el.className =
    "message user";

  const image =
    document.createElement("img");

  image.className =
    "message-image";

  image.src =
    imageUrl;

  image.alt =
    "Прикреплённое изображение";

  el.appendChild(image);

  if (text) {

    const caption =
      document.createElement("div");

    caption.textContent =
      text;

    caption.style.marginTop =
      "8px";

    el.appendChild(caption);

  }

  messages.appendChild(el);

  messages.scrollTop =
    messages.scrollHeight;
}

/* =========================================================
   INPUT ФАЙЛОВ

photoInput.addEventListener(

  function() {

    if (
      photoInput.files &&

      );

    photoInput.value = "";

);

      );

    fileInput.value = "";

/* =========================================================
   ПРИКРЕПЛЕНИЕ
========================================================= */

async function handleAttachment(file) {

  if (
    waiting ||
    !file
  ) {

    return;

  }


  if (
    !file.type.startsWith("image/")
  ) {

    addMessage(
      "Пока NOA умеет анализировать только изображения.",
      "noa"
    );

    return;

  }


  if (
    file.size >
    8 * 1024 * 1024
  ) {

    addMessage(
      "Фото слишком большое. Максимальный размер — 8 МБ.",
      "noa"
    );

    return;

  }


  removePendingImage();


  pendingImageFile =
    file;


  pendingImageUrl =
    URL.createObjectURL(file);


  pendingAttachment.innerHTML = `
    <div class="pending-image-card">

      <img
        class="pending-image"
        src="${pendingImageUrl}"
        alt="Прикреплённое изображение"
      >

      <button
        class="remove-pending-image"
        id="removePendingImage"
        type="button"
        aria-label="Удалить изображение"
      >×</button>

    </div>
  `;


  pendingAttachment.classList.add("open");


  const removeButton =
    document.getElementById(
      "removePendingImage"
    );


  if (removeButton) {

    removeButton.addEventListener(
      "click",
      removePendingImage
    );

  }


  try {

    pendingImageData =
      await fileToDataURL(file);

  } catch (error) {

    console.error(
      "Ошибка чтения изображения:",
      error
    );

    removePendingImage();

    addMessage(
      "Не удалось подготовить изображение.",
      "noa error"
    );

    return;

  }


  input.focus();

}


/* =========================================================
   УДАЛЕНИЕ ВЛОЖЕНИЯ
========================================================= */

function removePendingImage() {

  if (pendingImageUrl) {

    try {

      URL.revokeObjectURL(
        pendingImageUrl
      );

    } catch {}

  }


  pendingImageFile = null;
  pendingImageData = null;
  pendingImageUrl = null;


  pendingAttachment.innerHTML = "";

  pendingAttachment.classList.remove(
    "open"
  );

}


/* =========================================================
   FILE → DATA URL
========================================================= */

function fileToDataURL(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();

      reader.onload =
        function() {

          resolve(
            reader.result
          );

        };

      reader.onerror =
        function() {

          reject(
            new Error(
              "Не удалось прочитать изображение."
            )
          );

        };

      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   ИСТОРИЯ
========================================================= */

const HISTORY_KEY =
  "noa_chat_history";


function getHistory() {

  try {

    const data =
      localStorage.getItem(
        HISTORY_KEY
      );

    if (!data) {
      return [];
    }

    const parsed =
      JSON.parse(data);

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch {

    return [];

  }

}


function saveHistory(history) {

  try {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(history)
    );

  } catch (error) {

    console.error(
      "Не удалось сохранить историю:",
      error
    );

  }

}


function saveCurrentChat() {

  const items = [];

  const messageElements =
    messages.querySelectorAll(
      ".message"
    );


  messageElements.forEach(
    function(element) {

      if (
        element.id === "typing"
      ) {
        return;
      }

      const text =
        element.textContent.trim();

      if (!text) {
        return;
      }

      let type =
        "noa";

      if (
        element.classList.contains("user")
      ) {

        type = "user";

      }

      items.push({
        type: type,
        text: text
      });

    }
  );


  if (!items.length) {
    return;
  }


  const history =
    getHistory();


  history.unshift({
    id:
      Date.now(),

    date:
      new Date().toLocaleString(
        "ru-RU"
      ),

    title:
      items.find(
        item => item.type === "user"
      )?.text ||
      "Новый чат",

    messages:
      items
  });


  /* Оставляем последние 50 чатов */

  const limited =
    history.slice(0, 50);


  saveHistory(limited);

}

   ОТКРЫТИЕ ПАНЕЛИ
========================================================= */

function openPanel(

/* =========================================================
   ИСТОРИЯ
========================================================= */

function showHistory() {

  const history =
    getHistory();


  if (!history.length) {

    openPanel(
      "История запросов",
      `
        <div class="history-empty">
          Здесь появятся твои прошлые чаты.
        </div>
      `
    );

    return;

  }


  let html = "";


  history.forEach(
    function(chat) {

      html += `
        <button
          class="history-item"
          type="button"
          data-history-id="${chat.id}"
        >

          <div class="history-item-title">
            ${escapeHTML(
              chat.title
            )}
          </div>

          <div class="history-item-date">
            ${escapeHTML(
              chat.date
            )}
          </div>

        </button>
      `;

    }
  );


  openPanel(
    "История запросов",
    html
  );


  panelContent
    .querySelectorAll(
      ".history-item"
    )
    .forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            const id =
              Number(
                button.dataset.historyId
              );

            loadHistoryChat(id);

          }
        );

      }
    );

}


function loadHistoryChat(id) {

  const history =
    getHistory();

  const chat =
    history.find(
      item => item.id === id
    );


  if (!chat) {
    return;
  }


  messages.replaceChildren();


  chat.messages.forEach(
    function(item) {

      addMessage(
        item.text,
        item.type
      );

    }
  );


  startNOA();

  closePanel();
  closeMenuPanel();

  input.focus();

}


/* =========================================================
   ЭКРАНИРОВАНИЕ HTML
========================================================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function showNotifications() {

  const enabled =
    localStorage.getItem(
      "noa_notifications"
    ) === "true";


  openPanel(
    "Уведомления",
    `
      <div class="panel-card">

        <div class="setting-row">

          <div>

            <div class="setting-name">
              Уведомления NOA
            </div>

            <div class="setting-description">
              Настройка уведомлений для сайта.
            </div>

          </div>

          <label class="switch">

            <input
              type="checkbox"
              id="notificationsToggle"
              ${enabled ? "checked" : ""}
            >

            <span class="slider"></span>

          </label>

        </div>

      </div>

      <div class="panel-card">

        <div class="panel-card-text">
          Для настоящих push-уведомлений потребуется подключить Service Worker и серверную подписку.
        </div>

      </div>
    `
  );


  const toggle =
    document.getElementById(
      "notificationsToggle"
    );


  if (!toggle) {
    return;
  }


  toggle.addEventListener(
    "change",
    async function() {

      if (!toggle.checked) {

        localStorage.setItem(
          "noa_notifications",
          "false"
        );

        return;

      }


      if (
        !("Notification" in window)
      ) {

        toggle.checked = false;

        addMessage(
          "Этот браузер не поддерживает уведомления.",
          "noa"
        );

        return;

      }


      try {

        const permission =
          await Notification.requestPermission();


        if (
          permission === "granted"
        ) {

          localStorage.setItem(
            "noa_notifications",
            "true"
          );

        } else {

          toggle.checked = false;

          localStorage.setItem(
            "noa_notifications",
            "false"
          );

        }

      } catch {

        toggle.checked = false;

      }

    }
  );

}

              id="motionToggle"
              ${reduced ? "checked" : ""}
            >

            <span class="slider"></span>

          </label>

        </div>


        <div class="setting-row">

          <div>

            <div class="setting-name">
              Чёрная тема
            </div>

            <div class="setting-description">
              Основная тема NOA.
            </div>

          </div>

          <span style="color:#777">
            Всегда
          </span>

        </div>

      </div>

      <button
        class="panel-button"
        id="clearHistoryButton"
        type="button"
      >
        Очистить историю
      </button>
    `
  );


  const motionToggle =
    document.getElementById(
      "motionToggle"
    );


  if (motionToggle) {

    motionToggle.addEventListener(
      "change",
      function() {

        localStorage.setItem(
          "noa_reduced_motion",
          motionToggle.checked
            ? "true"
            : "false"
        );

        document.documentElement
          .classList.toggle(
            "noa-reduced-motion",
            motionToggle.checked
          );

      }
    );

  }


  document
    .getElementById(
      "clearHistoryButton"
    )
    ?.addEventListener(
      "click",
      function() {

        if (
          confirm(
            "Очистить всю историю запросов?"
          )
        ) {

          localStorage.removeItem(
            HISTORY_KEY
          );

          showSettings();

        }

      }
    );

}

/* =========================================================
   МУЗЫКАЛЬНЫЙ ПЛЕЕР
========================================================= */

const musicPlayer =
  document.getElementById(
    "musicPlayer"
  );

const musicCover =
  document.getElementById(
    "musicCover"
  );

const musicTitle =
  document.getElementById(
    "musicTitle"
  );

const musicStatus =
  document.getElementById(
    "musicStatus"
  );

const musicPlay =
  document.getElementById(
    "musicPlay"
  );

const musicClose =
  document.getElementById(
    "musicClose"
  );

const musicPrev =
  document.getElementById(
    "musicPrev"
  );

const musicNext =
  document.getElementById(
    "musicNext"
  );


let currentMusic =
  null;

let musicAudio =
  null;


/*
  Здесь пока нет нелегального источника
  для коммерческой музыки.

  Поэтому плеер готов визуально,
  но реальные треки подключим отдельно
  через легальный источник.
*/


function showMusicPlayer(
  artist,
  title,
  cover
) {

  currentMusic = {
    artist: artist,
    title: title,
    cover: cover || ""
  };


  musicTitle.textContent =
    artist
      ? artist + " — " + title
      : title;


  musicStatus.textContent =
    "Источник музыки пока не подключён";


  if (cover) {

    musicCover.src =
      cover;

  } else {

    musicCover.removeAttribute(
      "src"
    );

  }


  musicPlayer.classList.add(
    "open"
  );

  musicPlayer.classList.remove(
    "paused"
  );

}


function hideMusicPlayer() {

  musicPlayer.classList.remove(
    "open"
  );


  if (musicAudio) {

    try {
      musicAudio.pause();
    } catch {}

  }


  musicAudio = null;

  currentMusic = null;

}


musicPlay.addEventListener(
  "click",
  function() {

    if (!musicAudio) {

      musicStatus.textContent =
        "Аудиоисточник ещё не подключён";

      return;

    }


    if (
      musicAudio.paused
    ) {

      musicAudio.play();

      musicPlay.textContent =
        "Ⅱ";

      musicPlayer.classList.remove(
        "paused"
      );

    } else {

      musicAudio.pause();

      musicPlay.textContent =
        "▶";

      musicPlayer.classList.add(
        "paused"
      );

    }

  }
);


musicClose.addEventListener(
  "click",
  hideMusicPlayer
);


musicPrev.addEventListener(
  "click",
  function() {

    musicStatus.textContent =
      "Предыдущий трек";

  }
);


musicNext.addEventListener(
  "click",
  function() {

      "Следующий трек";

  }
);


/* =========================================================
   РАСПОЗНАВАНИЕ МУЗЫКАЛЬНОЙ КОМАНДЫ
========================================================= */

function detectMusicCommand(text) {

  const value =
    text
      .toLowerCase()
      .trim();


  if (!value) {
    return null;
  }


  const musicWords = [
    "включи",
    "включить",
    "поставь",
    "поставить",
    "запусти",
    "запустить",
    "сыграй",
    "играй",
    "воспроизведи"
  ];


  const hasMusicCommand =
    musicWords.some(
      word =>
        value.includes(word)
    );


  if (!hasMusicCommand) {
    return null;
  }


  /*
    Примеры:

    "включи любую песню BLACKPINK"
    "включи BLACKPINK Pretty Savage"
  */

  let artist =
    "";

  let title =
    "";


  if (
    value.includes("blackpink")
  ) {

    artist =
      "BLACKPINK";

    if (
      value.includes(
        "pretty savage"
      )
    ) {

      title =
        "Pretty Savage";

    } else {

      title =
        "Выбранная песня";

    }

  }


  /*
    Если команда не содержит
    известного исполнителя,
    всё равно открываем плеер
    с распознанным текстом.
  */

  if (!artist) {

    const cleaned =
      text
        .replace(
          /включи|включить|поставь|поставить|запусти|запустить|сыграй|играй|воспроизведи/gi,
          ""
        )
        .trim();


    title =
      cleaned ||
      "Музыка";

  }


  return {
    artist: artist,
    title: title
  };

}


/* =========================================================
   ОТПРАВКА
========================================================= */

chatForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const text =
      input.value.trim();


    if (
      !text &&
      !pendingImageData
    ) {

      return;

    }


    if (waiting) {
      return;
    }


    /*
      Музыкальные команды перехватываем
      ДО /api/chat.

      Поэтому NOA не отправляет
      дополнительный текстовый ответ.
    */

    const musicCommand =
      detectMusicCommand(text);


    if (
      musicCommand &&
      !pendingImageData
    ) {

      startNOA();

      closeMenuPanel();
      closeAttachmentMenu();


      showMusicPlayer(
        musicCommand.artist,
        musicCommand.title
      );


      input.value = "";

      input.style.height =
        "42px";


      input.focus();

      return;

    }


    /* Обычный запрос */

    startNOA();

    closeMenuPanel();
    closeAttachmentMenu();


    const imageData =
      pendingImageData;

    const imageUrl =
      pendingImageUrl;


    if (imageData) {

      addImageMessage(
        imageUrl,
        text
      );

    } else {

      addMessage(
        text,
        "user"
      );

    }


    input.value = "";

    input.style.height =
      "42px";


    /*
      Сбрасываем вложение
      после отображения сообщения.
    */

    pendingImageFile = null;
    pendingImageData = null;
    pendingImageUrl = null;

    pendingAttachment.innerHTML = "";

    pendingAttachment.classList.remove(
      "open"
    );


    waiting = true;

    send.disabled = true;

    attachmentButton.disabled =
      true;


    showTyping();


    try {

      const payload = {
        message: text
      };


      if (imageData) {

        payload.image =
          imageData;

      }


      /*
        ВАЖНО:
        Этот endpoint оставляем
        таким же, как в рабочем NOA.
      */

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "Сервер вернул неправильный ответ."
        );

      }


      removeTyping();


      if (
        !response.ok ||
        !data ||
        !data.reply
      ) {

        addMessage(
          data?.reply ||
          "NOA не смог обработать запрос. Попробуй ещё раз.",
          "noa"
        );

      } else {

        addMessage(
          String(data.reply),
          "noa"
        );

      }


      /*
        Сохраняем чат после ответа NOA.
      */

      saveCurrentChat();


    } catch (error) {

      console.error(
        "NOA error:",
        error
      );


      removeTyping();


      addMessage(
        "Не удалось подключиться к NOA. Попробуй ещё раз.",
        "noa error"
      );

    } finally {

      waiting = false;

      send.disabled = false;

      attachmentButton.disabled =
        false;

      input.focus();

    }

  }
);
