<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOA v1</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #02070b;
    color: #72efff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.app {
    width: 90%;
    max-width: 600px;
}

.logo {
    font-size: 60px;
    font-weight: bold;
    letter-spacing: 14px;
    text-shadow:
        0 0 15px #00d9ff,
        0 0 40px #00d9ff;
}

.subtitle {
    color: #55747d;
    letter-spacing: 4px;
    font-size: 12px;
}

.core {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 1px solid #00d9ff;
    margin: 40px auto 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
        0 0 30px rgba(0,217,255,.4),
        inset 0 0 30px rgba(0,217,255,.15);
    animation: rotate 8s linear infinite;
}

.eye {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 20px #00d9ff,
        0 0 50px #00d9ff;
    animation: pulse 2s infinite;
}

.status {
    margin-bottom: 20px;
    color: #9bcbd3;
}

.panel {
    padding: 15px;
    border: 1px solid rgba(0,217,255,.4);
    border-radius: 18px;
    background: rgba(3,13,18,.9);
}

textarea {
    width: 100%;
    height: 80px;
    box-sizing: border-box;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #061017;
    color: white;
    font-size: 17px;
    outline: none;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

button {
    flex: 1;
    padding: 14px;
    border: 1px solid #00d9ff;
    border-radius: 12px;
    background: #06151b;
    color: #72efff;
    font-size: 16px;
}

.answer {
    margin-top: 18px;
    min-height: 45px;
    color: white;
    font-size: 18px;
}

.hint {
    margin-top: 15px;
    color: #3e646d;
    font-size: 11px;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes pulse {
    50% {
        transform: scale(1.1);
        opacity: .8;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">NOA</div>

    <div class="subtitle">
        NEURAL OPERATING ASSISTANT
    </div>

    <div class="core">
        <div class="eye"></div>
    </div>

    <div id="status" class="status">
        ● СИСТЕМА ГОТОВА
    </div>

    <div class="panel">

        <textarea
            id="command"
            placeholder="Напиши команду...">
        </textarea>

        <div class="buttons">

            <button onclick="voiceInput()">
                🎙️
            </button>

            <button onclick="runNOA()">
                ОТПРАВИТЬ
            </button>

        </div>

        <div id="answer" class="answer">
            NOA ожидает команду.
        </div>

    </div>

    <div class="hint">
        NOA v1.0 • OFFLINE
    </div>

</div>

<script>

function speak(text) {

    if (!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "ru-RU";
    voice.rate = 0.9;

    speechSynthesis.speak(voice);
}


function runNOA() {

    const input =
        document
        .getElementById("command")
        .value
        .trim()
        .toLowerCase();

    let response;


    if (!input) {

        response =
            "Команда не обнаружена.";

    }

    else if (input.includes("привет")) {

        response =
            "Привет. Я NOA. Система готова.";

    }

    else if (input.includes("как дела")) {

        response =
            "Все системы работают нормально.";

    }

    else if (input.includes("кто ты")) {

        response =
            "Я NOA — твой персональный голосовой помощник.";

    }

    else if (input.includes("тест")) {

        response =
            "Диагностика завершена. Я работаю.";

    }

    else if (input.includes("спасибо")) {

        response =
            "Всегда пожалуйста.";

    }

    else if (input.includes("время")) {

        const time =
            new Date().toLocaleTimeString(
                "ru-RU",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        response =
            "Сейчас " + time;

    }

    else {

        response =
            "Команда принята: " + input;

    }


    document
        .getElementById("answer")
        .textContent = response;

    document
        .getElementById("status")
        .textContent =
        "● КОМАНДА ОБРАБОТАНА";

    speak(response);
}


function voiceInput() {

    const field =
        document.getElementById("command");

    field.focus();

    document
        .getElementById("status")
        .textContent =
        "● ГОТОВ К ДИКТОВКЕ";

}

</script>

</body>
</html>
