<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOA AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* HEADER */

.header {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid #222;
    background: rgba(10,10,10,.92);
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 20px;
    font-weight: 700;
}

.logo span {
    color: #777;
    font-weight: 400;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #777;
    font-size: 14px;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff2424;
    box-shadow: 0 0 12px #ff2424;
}

/* CHAT */

.chat {
    height: calc(100vh - 64px - 88px);
    overflow-y: auto;
    padding: 30px 18px 40px;
}

.messages {
    max-width: 800px;
    margin: auto;
}

.welcome {
    text-align: center;
    margin-top: 17vh;
}

.welcome-logo {
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -4px;
    color: #ff3030;
    text-shadow:
        0 0 15px rgba(255,0,0,.35),
        0 0 45px rgba(255,0,0,.12);
}

.welcome h1 {
    margin: 16px 0 7px;
    font-size: 27px;
}

.welcome p {
    margin: 0;
    color: #777;
    font-size: 15px;
}

/* MESSAGES */

.message {
    display: flex;
    margin: 18px 0;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 78%;
    padding: 13px 16px;
    border-radius: 18px;
    line-height: 1.45;
    font-size: 16px;
}

.user .bubble {
    background: #242424;
    border: 1px solid #333;
}

.ai .bubble {
    background: transparent;
    padding-left: 0;
    color: #ddd;
}

/* INPUT */

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px 18px;
    background: linear-gradient(
        transparent,
        #080808 28%
    );
}

.input-box {
    max-width: 800px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 9px 8px 16px;
    background: #151515;
    border: 1px solid #303030;
    border-radius: 24px;
    box-shadow: 0 0 25px rgba(255,0,0,.06);
}

.input-box:focus-within {
    border-color: #552020;
    box-shadow: 0 0 25px rgba(255,0,0,.10);
}

input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
    min-width: 0;
}

input::placeholder {
    color: #666;
}

.send {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #ff2525;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 0 14px rgba(255,0,0,.25);
}

.send:hover {
    transform: scale(1.05);
    background: #ff3b3b;
}

.send:active {
    transform: scale(.94);
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        padding: 0 17px;
    }

    .chat {
        padding-left: 13px;
        padding-right: 13px;
    }

    .welcome {
        margin-top: 14vh;
    }

    .welcome-logo {
        font-size: 48px;
    }

    .bubble {
        max-width: 86%;
    }

    .input-area {
        padding-left: 10px;
        padding-right: 10px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">
        NOA <span>AI</span>
    </div>

    <div class="status">
        <div class="status-dot"></div>
        Онлайн
    </div>
</header>

<main class="chat" id="chat">
    <div class="messages" id="messages">

        <div class="welcome" id="welcome">
            <div class="welcome-logo">NOA</div>
            <h1>Чем могу помочь?</h1>
            <p>Твой персональный AI-ассистент</p>
        </div>

    </div>
</main>

<div class="input-area">
    <div class="input-box">
        <input
            id="input"
            type="text"
            placeholder="Напишите сообщение..."
            autocomplete="off"
        >

        <button class="send" id="send">
            ↑
        </button>
    </div>
</div>

<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

function addMessage(text, type) {

    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(bubble);
    messages.appendChild(message);

    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;
}

function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    // Временно отвечаем тестовым сообщением.
    // Позже здесь подключим настоящий AI.

    setTimeout(() => {
        addMessage(
            "Я NOA. Сейчас я работаю в тестовом режиме. Скоро подключим настоящий искусственный интеллект.",
            "ai"
        );
    }, 600);
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

</script>

</body>
</html>
